<style>
/* The app's palette, verbatim from src/constants/theme.ts. */
:root{
  --bg:#FAF5EC; --card:#FFFFFF; --paper-deep:#F1EADC; --border:#ECE6DA; --rule:#ECE6DA;
  /* The drawn edge of an answer. --border is a hairline meant to sit on beige
     and all but disappears on white, which is what made the white answers read
     as floating blobs. Rise draws its options in #BDBDBD; this is that weight
     of grey warmed to the cream. */
  --line:#CFC5B3;
  --text:#1A2238; --text-secondary:#6B7280; --text-muted:#9AA0AB; --text-faint:#C2BBAD;
  --navy:#1A2238; --accent:#F58A3C; --accent-dark:#F47B45; --accent-wash:#FDEEE2;
  --green:#3E9C6D; --green-bg:#E6F4EC; --green-text:#2E7D52;
  --amber:#F5A623; --amber-bg:#FCEFD6; --amber-text:#A86A14;
  --red:#E5564E; --red-bg:#FBE3E1; --red-text:#C0392F; --danger-text:#D8453D;
  --progress-bg:#E7DFCF; --handle-bar:#D8CFBE; --yellow:#FFC93C; --phone-body:#14161F;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --col:420px;
  /* The vertical air, as one dial.
     The design used to switch between two fixed spacings at 900px of viewport,
     and the tight one was drawn to fit the longest screen on a 667pt handset.
     That made it the spacing every phone got, so an 844pt screen ran its
     content to two thirds of the height and left the last third empty, and a
     desktop window left half. The air is now read off the room instead of
     picked from two values: nothing at 660, a little more with every pixel
     above it, and capped so a very tall window stops stretching and simply has
     margins. Multiplied per property below, because a gap between two rows and
     the height of a chart do not want to grow at the same rate. */
  --air:clamp(0px, calc((100dvh - 660px) / 19), 34px);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* One screenful, never more. The reader answers a question and presses a button;
   having to scroll to find the button turns an answer into a search. So the page
   is a column exactly the height of the viewport, the flow takes what is left
   after the legal footer, and every screen is sized to fit inside that. */
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.4;overscroll-behavior-y:none;
  height:100dvh;display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;margin:0;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
img{max-width:100%}

.app{position:relative;width:100%;max-width:var(--col);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
/* The chrome: back on the left, the ten question segments filling the rest. */
.chrome{
  position:absolute;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:14px;
  padding:calc(var(--safe-top) + 60px) 20px 14px;
  /* The chrome floats over the screen, so it needs its own ground to stand on:
     without it a title that runs long reads through the back button. */
  background:rgba(250,245,236,0.97);
}
.chrome[hidden]{display:none}
.back{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:19px;background:#fff;border:1px solid var(--border);
}
.back:active{background:var(--paper-deep)}
.back[data-hidden="1"]{visibility:hidden}
/* Twenty two segments now rather than ten, so the gap comes in: at 4px the
   spacing took more of the track than the segments did and the bar read as
   a dotted line instead of a measure of how far along the reader is. */
.bar{flex:1;display:flex;gap:2.5px;height:4px}
.bar span{flex:1;background:var(--progress-bg);border-radius:2px;transition:background .3s ease}
.bar span.on{background:var(--accent)}

/* min-height:0 is what lets a screen shrink to the viewport instead of pushing
   the button off the bottom, but on its own it would silently cut the last line
   off a screen too tall to fit. Every screen is sized so that never happens down
   to a 375 x 667 handset; below that, or in a language whose copy runs longer,
   overflow becomes a scroll of this box rather than content the reader never
   sees. Nothing is ever lost, and on every size that fits there is nothing to
   scroll. */
.step{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  padding:calc(var(--safe-top) + 76px + var(--air) * 1.1) 24px calc(8px + var(--air) * .1)}
.step.chromeless{padding-top:calc(var(--safe-top) + 18px + var(--air) * .25)}
/* Two spacers, so a screen whose content runs out early is not left sitting in
   the top half of the room with the rest of it blank. They are flex-basis zero
   and allowed to shrink, so the instant the content needs the whole height they
   collapse to nothing and the screen is laid out exactly as it was. The one
   below takes the larger share: a title that drifts to the middle of the page
   reads as a slide rather than as a question, so the block settles above centre
   rather than on it. */
.step::before,.step::after{content:"";display:block;flex:1 1 0;min-height:0}
.step::after{flex-grow:1.7}
.step--hero::before,.step--hero::after,
.step--sym::before,.step--sym::after,
.step--compare::before,.step--compare::after{content:none}
/* The hero draws its own frame edge to edge, so the step gives up its gutter. */
.step--hero{padding:0;display:flex;flex-direction:column}

/* The flow moves sideways. The screen being left goes out the way the move went
   and the next one comes in behind it, so going forward and going back feel like
   opposite moves rather than the same jump twice. Never a fade: a screen that
   dissolves into another reads as a correction, not as progress.
   The step and its button travel together because in the app they are one screen;
   here the button is docked to the bottom for the sake of a thumb on a keyboard.
   Clipping is horizontal only. `clip` rather than `hidden` so the axis left alone
   stays visible and scrollable, since a long screen here scrolls the document
   where the app scrolls a ScrollView, and so the docked button can still stick. */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow-x:clip}
.layer{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
.layer-out{position:absolute;top:0;left:0;right:0;z-index:0}
.layer.slide-in{animation:slide-in .3s cubic-bezier(.22,.61,.36,1) both}
.layer-out.slide-out{animation:slide-out .3s cubic-bezier(.22,.61,.36,1) both}
@keyframes slide-in{from{transform:translateX(var(--dx))}to{transform:none}}
@keyframes slide-out{from{transform:none}to{transform:translateX(var(--dx))}}

/* Content arrives rather than appearing: it fades up through a few pixels. The
   distance is deliberately small, because a long travel reads as a thing being
   flown in from somewhere and the point here is only that the page settled.
   Anything waiting on a drawing travels shorter still, so it settles under a
   line that has only just stopped moving. */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise-short{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.layer{animation:none}*{transition:none!important;animation-duration:.01ms!important}}

.dock{
  position:sticky;bottom:0;z-index:20;padding:12px 22px calc(var(--safe-bottom) + 30px);
  background:linear-gradient(to bottom,rgba(250,245,236,0),var(--bg) 26%);
}
.dock[hidden]{display:none}

/* type */
/* stepTitle / stepSub / stepHint, straight off the app's StyleSheet. The size
   is per screen, so only the parts every title shares live here. */
h1.title{font-size:27px;line-height:32px;font-weight:700;letter-spacing:-.5px;margin:0;color:var(--text)}
.sub{font-size:15px;line-height:22px;color:var(--text-secondary);
  margin:calc(10px + var(--air) * .3) 0 0}
.hint{font-size:14px;line-height:20px;color:var(--text-secondary);margin:8px 0 0}
.mono,.field-label,.group-label,.chart-caption,.big-unit{
  font-family:var(--mono);text-transform:uppercase;color:var(--text-muted);
}

/* Per screen title sizes. The app sets these one screen at a time; so does this. */
.step--stakes h1.title{font-size:25px;line-height:32px;letter-spacing:-.4px;text-align:center}
.step--feel h1.title,.step--habits h1.title,.step--upffreq h1.title,
.step--additives h1.title{font-size:26px}
.step--plan h1.title{font-size:26px;text-align:center}
.step--account h1.title,.step--email h1.title{font-size:29px;text-align:center}
.step--about h1.title{font-size:30px;line-height:36px}
.step--reviews h1.title{font-size:30px;line-height:38px}
.group-label{font-size:11px;letter-spacing:1px;margin:24px 0 11px}
.field-label{font-size:11px;letter-spacing:1px;margin:20px 0 8px}
.chart-caption{font-size:10px;letter-spacing:1.2px;margin-top:14px;line-height:1.5}
.source{font-size:10.5px;line-height:1.45;color:var(--text-faint);margin-top:16px}
.note{font-size:11.5px;line-height:1.5;color:var(--text-muted);margin-top:14px}
.body-copy{font-size:15px;line-height:1.55;color:var(--text-secondary);margin:18px 0 0}
/* A highlight is coloured by what it says, not by the brand: the fortnight on
   real food reads well, the share of untested additives does not. */
.step--feel .hl{color:var(--green-text)}
.step--stakes .hl{color:var(--danger-text)}

/* thumbs. Two discs rather than two cards, which is how Rise draws the same
   answer: a card is a thing you read before you press, and a round target is
   a thing you press. Side by side as equals rather than stacked, where the
   top one reads as the expected one, and Yup on the left because the run
   reads left to right and the statements are written to be agreed with.
   The hand is drawn in currentColor so it inverts with the disc instead of
   needing a second icon for the chosen state. Pushed to the two edges of the
   column rather than bunched in the middle, so Nope sits under the left thumb
   and Yup under the right one and neither has to be aimed for. */
.thumbs{display:flex;justify-content:space-between;
  gap:clamp(18px, 7vw, 44px);margin-top:calc(22px + var(--air) * .7)}
.thumbs .thumb{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:none;border:0;padding:0;color:inherit;
}
.thumb-disc{
  /* The floor is the diameter verified on a 667pt handset; the ceiling is
     where a target stops being a button and starts being a plate. */
  width:clamp(104px, calc(104px + var(--air) * 2.6), 160px);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--card);border:1px solid var(--line);
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
}
.thumbs .thumb:active .thumb-disc{background:var(--paper-deep);transform:scale(.96)}
.thumbs .thumb.on .thumb-disc{background:var(--navy);border-color:var(--navy);color:#fff}
/* The mark is sized off the disc, so one drawing serves every viewport. */
.thumb-disc svg{display:block;width:42%;height:42%}
.thumb-label{font-size:16px;font-weight:600;letter-spacing:-.1px}
/* The statement is the whole screen, so it gets the room a title gets and
   is not asked to share it with a line explaining itself. With no sub line
   and no button, top-packing leaves two thirds of the screen empty under
   the answers; the auto margins drop them into the middle of whatever room
   the statement left, so the hands sit where the thumb already is.
   The reserve below tips that middle upward: split evenly, the pair sat low
   enough that the gap under the statement read as a missing paragraph. */
.step--sym{display:flex;flex-direction:column}
.step--sym h1.title{font-size:28px;line-height:34px}
.step--sym .thumbs{margin-top:auto;margin-bottom:auto}
.step--sym::after{content:"";display:block;flex:none;height:10vh}
/* Counts the round, not the funnel. The bar above counts every question in
   the quiz and so barely moves across twelve fast screens; this says how far
   through the fast part you are, which is the thing being asked. */
.sym-counter{font-size:13px;font-weight:600;letter-spacing:-.1px;color:var(--text-muted);margin:0 0 10px}

/* the lightning round's door. Two rings under a number, pale enough that the
   number is the only thing with any weight on the screen. */
.lightning{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;min-height:70vh;padding:0 24px}
.lightning h1.title{margin:0}
.lightning .sub{margin-top:10px}
.count-ring{
  position:relative;display:flex;align-items:center;justify-content:center;
  width:clamp(168px, calc(168px + var(--air) * 4.4), 300px);aspect-ratio:1;
  margin-top:calc(22px + var(--air) * 1.2);
}
.count-ring::before,.count-ring::after{content:"";position:absolute;border-radius:50%;background:var(--paper-deep)}
.count-ring::before{inset:0;opacity:.55}
.count-ring::after{inset:15%}
.count-num{
  /* Both rings are pseudo-elements and the outer one is the last child, so
     without a lift it paints over the number it is supposed to sit behind. */
  position:relative;z-index:1;font-size:clamp(62px, 18vw, 104px);line-height:1;
  font-weight:700;letter-spacing:-2px;
  animation:countpop .32s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes countpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* rows and chips */
.rows{display:flex;flex-direction:column;
  gap:calc(8px + var(--air) * .3);margin-top:calc(14px + var(--air) * 1)}
.row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  min-height:calc(58px + var(--air) * 1);
  background:var(--card);border-radius:calc(18px + var(--air) * .15);
  padding:calc(10px + var(--air) * .25) calc(14px + var(--air) * .08);
  border:1px solid var(--line);transition:background .18s ease,border-color .18s ease;
}
.row .label{flex:1;font-size:16px;font-weight:600;margin-left:2px}
/* A row with no disc in front of it: the 2px that clears the disc has nothing
   to clear, and would read as an indent against the title above. */
.rows--plain .row .label{margin-left:0}
.row .sublabel{display:block;font-size:12.5px;font-weight:400;color:var(--text-muted);margin-top:1px}
.row.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row.on .sublabel{color:rgba(255,255,255,.62)}
/* The row is white now, so the disc takes the deeper paper to stay a disc at
   all, and goes white again on the navy it is inverted onto. Either way it
   reads as a held shape rather than a hole. */
.disc{
  --d:40px;width:var(--d);height:var(--d);flex:none;border-radius:50%;background:var(--paper-deep);
  display:flex;align-items:center;justify-content:center;
}
.row.on .disc,.check-row.on .disc,.chip.on .disc{background:#fff}

/* checkRow. The box comes first, then the disc, then the label, and any
   second line hangs under the lot rather than beside it. */
.check-row{
  display:block;width:100%;text-align:left;background:var(--card);border-radius:22px;
  padding:15px 16px;border:1px solid var(--line);transition:background .18s ease;
}
.check-row .check-head{display:flex;align-items:center;gap:12px}
.check-row .label{flex:1;font-size:15px;font-weight:600}
.check-sub{display:block;padding-top:9px;padding-left:34px;font-size:12.5px;color:var(--text-secondary)}
.check-row.on{background:var(--navy);color:#fff}
.check-row.on .check-sub{color:rgba(255,252,245,.7)}
.checkbox{
  width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--handle-bar);
  display:flex;align-items:center;justify-content:center;
}
.check-row.on .checkbox{border-color:var(--accent);background:var(--accent)}
.checkbox svg{opacity:0}
.check-row.on .checkbox svg{opacity:1}
.tick{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--handle-bar);display:flex;align-items:center;justify-content:center}
.row.on .tick{border-color:var(--accent);background:var(--accent)}
.tick svg{opacity:0}
.row.on .tick svg{opacity:1}

/* chipBtn. Gap 9 on the answer grids, 10 on goals, exactly as the app sets it. */
.chips{display:flex;flex-wrap:wrap;
  gap:calc(8px + var(--air) * .12);margin-top:calc(14px + var(--air) * .9)}
.chips--goals{gap:10px;margin-top:0}
/* The border is drawn inside rather than added, so turning the chips white
   does not make every answer grid on the flow two pixels taller. */
.chip{
  display:flex;align-items:center;gap:10px;max-width:100%;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);
  border-radius:999px;padding:9px 18px 9px 9px;font-size:14.5px;font-weight:600;
  transition:background .18s ease,box-shadow .18s ease;
}
.chip .label{flex-shrink:1}
.chip--plain{padding:15px 22px;font-size:17.5px}
.chip.on{background:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);color:#fff}
/* Only a bare glyph inverts with the chip. A glyph on a disc keeps its ink,
   because the disc stays white underneath it: turning both white is how a
   selected goal ended up as an empty white circle. */
.chip.on > .ink path{fill:#fff}

/* allergyWarning */
.allergy-warning{
  display:flex;align-items:flex-start;gap:11px;background:var(--amber-bg);
  border-radius:16px;padding:14px 15px;margin-top:22px;
}
.allergy-warning svg{flex:none;margin-top:1px}
.allergy-warning p{flex:1;margin:0;font-size:12.5px;line-height:19px;color:#8A6A2E}

/* buttons */
.cta{
  width:100%;height:58px;border-radius:999px;background:var(--navy);color:#fff;
  font-size:17px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 26px rgba(26,34,56,.16);
  transition:opacity .15s ease,transform .1s ease;
}
.cta:active{transform:scale(.98);opacity:.92}
.cta[disabled]{opacity:.35;cursor:default;box-shadow:none}
.cta.outline{background:#fff;border:1px solid var(--border);color:var(--text);font-weight:600}
/* The wallet button is drawn by Stripe inside an iframe, so it is given the
   width and a height to hold and nothing else. */
.xdock{min-height:48px}

/* How to pay. The card is pushed off the bottom of the window rather than
   hidden, because Stripe measures the box it was handed and a box that has
   been display:none is a box with no width: the wallet button would mount
   into nothing and never appear. Closed, it still has the full width of the
   column it will open into. */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.sheet.off{pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(26,34,56,.45);transition:opacity .22s ease}
.sheet.off .scrim{opacity:0}
.sheet .card{
  position:relative;width:100%;max-width:var(--col);
  background:var(--bg);border-radius:22px 22px 0 0;
  padding:22px 22px calc(var(--safe-bottom) + 20px);
  box-shadow:0 -14px 40px rgba(26,34,56,.18);
  transition:transform .26s cubic-bezier(.22,.61,.36,1);
}
.sheet.off .card{transform:translateY(110%)}
.sheet-x{
  position:absolute;top:13px;right:15px;width:30px;height:30px;border-radius:15px;
  background:none;border:0;display:flex;align-items:center;justify-content:center;
}
.sheet-x:active{opacity:.5}
.sheet-title{
  font-size:19px;line-height:25px;font-weight:700;letter-spacing:-.3px;
  margin:0 34px 0 0;color:var(--text);
}
.sheet-price{font-size:14px;line-height:20px;color:var(--text-secondary);margin:6px 0 16px}
/* A rule either side of the word, so the wallet above it and the card form
   below it read as two ways of doing the same thing rather than a list. */
.sheet-or{
  display:flex;align-items:center;gap:10px;margin:14px 0;
  font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text-muted);
}
.sheet-or::before,.sheet-or::after{content:"";flex:1;height:1px;background:var(--border)}
/* The store buttons wear the badge the landing page wears, so the handoff
   looks like the same company. Same two-line lockup, sat inside the dock's
   full-width pill rather than the landing page's inline one. */
.cta.store{gap:12px;text-decoration:none}
.cta.store svg{width:24px;height:24px;flex:none;fill:currentColor}
.cta.store .txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.cta.store .txt small{font-size:11px;font-weight:500;opacity:.72;letter-spacing:.1px}
.cta.store .txt strong{font-size:17px;font-weight:600;letter-spacing:-.2px}
.link{display:block;width:100%;text-align:center;margin-top:12px;font-size:14px;font-weight:500;color:var(--text-secondary);text-decoration:none;background:none}
.spin{width:17px;height:17px;border-radius:9px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}

/* cards and charts. chartCard is soft rather than ruled: no border, a wide
   faint shadow, because a hairline around a drawing that has its own lines
   reads as a box holding a box. */
.chart{
  background:var(--card);border-radius:calc(22px + var(--air) * .18);
  padding:calc(11px + var(--air) * .2) calc(14px + var(--air) * .12) calc(8px + var(--air) * .18);
  margin-top:calc(11px + var(--air) * .6);
  box-shadow:0 8px 22px rgba(26,34,56,.05);
}
.chart h2{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:0 0 calc(7px + var(--air) * .3)}
.chart-caption{font-size:10px;line-height:15px;letter-spacing:.5px;text-align:center;
  margin-top:calc(6px + var(--air) * .4)}
/* A caption that names a drawing waits until there is a drawing to name. */
.chart-caption.late{animation:rise-short .26s cubic-bezier(.22,.61,.36,1) .95s both}
/* SweepReveal: the plot sits under a panel in the card's own colour, and the
   panel slides off it once, left to right. */
.sweep{position:relative;overflow:hidden}
.sweep .curtain{position:absolute;top:0;left:0;display:block;background:var(--card);
  animation:sweep .95s cubic-bezier(.22,.61,.36,1) .18s both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(100%)}}
.axis-tick{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.5px;
  color:var(--text-muted);text-align:center;line-height:1}
.line-end{position:absolute;width:46px;text-align:right;font-size:15px;font-weight:700;letter-spacing:-.3px}
.legend-row{display:flex;align-items:center;justify-content:center;margin-top:8px;
  animation:rise-short .26s cubic-bezier(.22,.61,.36,1) .91s both}
.legend-row i{width:14px;height:3.4px;border-radius:2px;margin-right:7px;display:block}
.legend-row span{font-size:12.5px;font-weight:500;color:var(--text-secondary)}
.ring-working{font-size:14px;line-height:20px;color:var(--text-secondary);text-align:center;margin:16px 0 0}
/* statRow: the figure and the unit it is in, read as one line. */
.statrow{display:flex;align-items:center;gap:14px;margin:calc(14px + var(--air) * .9) 0 0}
/* statBody, as the proof screens override it: one centred line under a chart. */
.caveat{font-size:13.5px;line-height:20px;color:var(--text-muted);text-align:center;
  margin:calc(6px + var(--air) * .4) 0 0}
.statrow b{font-size:62px;line-height:70px;font-weight:700;letter-spacing:-1.5px}
.statrow span{flex:1;font-family:var(--mono);font-size:12px;color:var(--text-secondary);
  letter-spacing:1px;line-height:18px}
/* A figure that stands on the paper rather than in a card, so it is centred
   rather than boxed. */
.figure{display:flex;justify-content:center;margin-top:22px}
.statbody{font-size:15px;line-height:22px;color:var(--text-secondary);text-align:center;margin:22px 0 0}
.statworking{font-family:var(--mono);font-size:11px;line-height:16px;color:var(--text-muted);
  letter-spacing:.5px;text-align:center;margin:22px 0 0}
/* The week, one slot a meal, seven to a row, across the whole column so it lines
   up with the rule and the bar below it rather than stopping two thirds of the
   way and leaving the right of the screen empty. Square marks, because a mark
   wider than it is tall reads as a bar of something measured and these are
   counted, not measured. */
.meal-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.meal-grid i{width:calc((100% - 48px)/7);aspect-ratio:1;border-radius:8px;background:var(--progress-bg)}
.meal-grid i.on{background:var(--red-text)}
/* The published figure, set under a rule as its own sentence rather than
   stood up as a rival headline. */
.ref-row{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
.ref-body{font-size:16px;line-height:24px;color:var(--text-secondary);margin:0}
.ref-body b{font-weight:700;color:var(--text)}
.ref-bar{height:10px;border-radius:5px;overflow:hidden;background:var(--progress-bg);margin-top:18px}
.ref-bar i{display:block;height:10px;border-radius:5px;background:var(--red-text)}
/* Their own count, the week that produced it, and the published figure under a
   rule. No card: a white box around a tally on beige paper reads as a panel that
   has not finished loading, and every attempt at one left more blank inside it
   than the void it was meant to cure. The room a taller phone gives goes into
   the marks themselves, because the size of the tally is the argument and the
   gap between the number and the rule is not. The working line is set left with
   the rest of the screen rather than centred under nothing. */
.step--upfshare .statworking{text-align:left;margin-top:calc(10px + var(--air) * .45)}
.step--upfshare .ref-row{margin-top:calc(20px + var(--air) * 1.1);
  padding-top:calc(16px + var(--air) * .5)}
/* The bar reads as the figure drawn out, so it follows the figure; the line
   explaining whose average it is follows both. */
.step--upfshare .ref-body--lead{margin-top:calc(16px + var(--air) * .6)}
/* Two columns of the same shape, so only their filled height differs. The
   corner radius is a plain number rather than a large one, because a large
   radius on a box this wide is clamped to half its height and rounds the
   track into an oval. */
.bar-row{display:flex;gap:18px;margin-top:2px}
.bar-col{flex:1}
.bar-value{font-size:26px;font-weight:700;letter-spacing:-.6px;text-align:center;margin:0 0 10px;
  animation:rise-short .26s cubic-bezier(.22,.61,.36,1) .87s both}
/* The floor is the height a 667pt handset can spare with the chart, its source
   line and the button all on screen together. Above that the track takes the
   room, because the smaller share is the point of the picture and 7% of a short
   track is a sliver that has to be floored to stay visible, which quietly draws
   it nearer 9%. A taller track pays for itself in honesty: at 200px the 7% fill
   clears the floor on its own and is drawn at its real height. */
.bar-track{width:clamp(64px, calc(64px + var(--air) * 3), 124px);
  margin:0 auto;height:clamp(68px, calc(68px + var(--air) * 8), 300px);
  border-radius:14px;background:var(--paper-deep);
  display:flex;align-items:flex-end;overflow:hidden}
/* Rounded at the top only. A fill rounded on all four corners reads as a second
   card laid over the track rather than as the track filling up, and at 93% the
   two sets of curves sat a few pixels apart and looked like a printing error. */
.bar-fill{display:block;width:100%;border-radius:13px 13px 0 0;min-height:8px;background:var(--navy);
  animation:growh .95s cubic-bezier(.22,.61,.36,1) both}
.bar-fill.alarm{background:var(--danger-text)}
@keyframes growh{from{height:0}}
/* Two lines of room whether the label needs them or not, so a label that wraps
   cannot shift its own column against the other one. */
.bar-label{min-height:40px;margin:12px 0 0;font-size:13.5px;font-weight:500;line-height:18px;
  color:var(--text-secondary);text-align:center}
/* On the one screen the chart is the argument, it takes the room the title and
   the switch leave instead of standing at a fixed height with the remainder
   blank underneath it. The centring spacers come off for the same reason: they
   and the track would be bidding for the same space, and the track should win.
   The track is the part that stretches, so a taller phone draws taller bars
   rather than the same bars further apart. */
.step--stakes::before,.step--stakes::after{content:none}
.step--stakes .chart{flex:1;min-height:0;display:flex;flex-direction:column}
.step--stakes .bar-row{flex:1;min-height:0}
.step--stakes .bar-col{display:flex;flex-direction:column;min-height:0}
.step--stakes .bar-track{flex:1;height:auto;min-height:68px}
.step--stakes .flag-card{margin-top:calc(10px + var(--air) * .5)}
/* The fortnight fills in a day at a time, the same pass the drawn charts are
   uncovered by. Every day is the same size: what arrives is the ink, not the
   height, because the strip counts days rather than measuring them. */
.days{display:flex;gap:5px;margin-top:calc(12px + var(--air) * .6)}
.days i{flex:1;height:calc(22px + var(--air) * .6);background:var(--green);
  animation:inkin .32s cubic-bezier(.22,.61,.36,1) both}
@keyframes inkin{from{opacity:0}to{opacity:var(--o)}}
.day-ends{display:flex;justify-content:space-between;margin-top:8px}
.day-ends span{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--text-muted)}
.outcomes{margin-top:14px}
.outcome{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(9px + var(--air) * .45) 0}
.outcome + .outcome{border-top:1px solid var(--rule)}
.outcome .what{flex:1;font-size:16px;font-weight:500;color:var(--text);line-height:1.3}
.outcome .val{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  letter-spacing:.2px;white-space:nowrap}
/* An axis is a block, not a row: name and weight over the full-width track,
   then the body whose guidance it follows underneath. The bar is a literal
   share of the whole track, so the three of them add up to one track and 40%
   cannot look like everything. */
.axis-block{margin-bottom:20px}
.axis-header{display:flex;align-items:baseline;justify-content:space-between}
.axis-name{flex-shrink:1;font-size:18px;font-weight:700;color:var(--text)}
.axis-weight{font-size:16px;font-weight:700;color:var(--text)}
.axis-track{height:9px;border-radius:999px;background:var(--progress-bg);margin-top:9px;overflow:hidden}
.axis-fill{display:block;height:100%;border-radius:999px;background:var(--navy);
  animation:groww .95s cubic-bezier(.22,.61,.36,1) both}
@keyframes groww{from{width:0}}
.axis-source{display:flex;align-items:center;gap:8px;margin-top:9px}
.axis-badge{flex:none;border:1px solid var(--border);background:#fff;border-radius:999px;padding:2px 8px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--text)}
.axis-source-text{flex:1;font-size:12px;line-height:17px;color:var(--text-secondary)}
.flag-card{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
  text-align:left;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:15px 16px;margin-top:22px;box-shadow:0 4px 14px rgba(26,34,56,.04)}
.flag-card .label{flex:1;font-size:14.5px;line-height:20px;font-weight:600;color:var(--text)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--progress-bg);flex:none;padding:3px;transition:background .2s ease}
.switch i{display:block;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s ease;
  box-shadow:0 1px 3px rgba(26,34,56,.2)}
.flag-card.on .switch{background:var(--accent)}
.flag-card.on .switch i{transform:translateX(18px)}

/* the bread comparison.
   The two ingredient lists are what the screen is about and they are fixed
   lengths, so the photos are what gives when the viewport is short: each slab
   shrinks out of its picture rather than pushing the button off screen. */
.step--compare{display:flex;flex-direction:column}
.compare{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.slab{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.slab img{display:block;width:100%;flex:1 1 136px;min-height:64px;object-fit:cover}
.slab .body{flex:none;padding:14px 16px 16px}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;background:var(--paper-deep);color:var(--text-secondary);border-radius:999px;padding:5px 10px;margin-bottom:8px}
.slab .ing{font-size:13.5px;line-height:1.6;color:var(--text-secondary)}
.slab .ing b{font-weight:600;color:var(--red-text);background:var(--red-bg);border-radius:4px;padding:1px 3px}
.footnote{text-align:center;font-size:13px;color:var(--text-muted);margin-top:2px}

/* reviews. Two proofs side by side above the reviews themselves: the placing,
   in a wreath because that is what a wreath means, and the download count as a
   crowd of faces rather than a figure on its own. */
/* The app starts this screen 18px higher than the rest, which it can afford
   because its chrome is a solid bar the content scrolls under. Here the chrome
   is transparent, so the title keeps the funnel's usual clearance. */
.proof-row{display:flex;align-items:flex-start;margin:12px 0 0}
.proof-col{flex:1;display:flex;flex-direction:column;align-items:center}
.proof-rank{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.6px;color:var(--text)}
.proof-caption{font-size:12.5px;line-height:17px;font-weight:500;color:var(--text-secondary);
  text-align:center;margin:3px 0 0;padding:0 4px}
.wreath{display:flex;align-items:center}
.wreath-mid{display:flex;flex-direction:column;align-items:center;padding:0 2px}
.wreath-flip{display:flex;transform:scaleX(-1)}

/* The discs overlap, so the second reads as standing behind the first and the
   count as the rest of them. */
.avatar-cluster{display:flex;align-items:center;height:58px}
.cluster-disc{width:40px;height:40px;border-radius:20px;background:var(--accent-wash);
  border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--accent-dark);box-sizing:border-box}
.cluster-disc + .cluster-disc{margin-left:-16px}
.cluster-count{width:auto;height:46px;border-radius:23px;padding:0 10px;margin-left:-14px}

.review-card{background:var(--paper-deep);border-radius:20px;padding:14px;margin-top:9px}
.review-head{display:flex;align-items:center;gap:10px}
.review-avatar{flex:none;width:34px;height:34px;border-radius:17px;background:var(--accent-wash);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent-dark)}
.review-name{flex:1;font-size:15.5px;font-weight:700;color:var(--text)}
.star-row{display:flex;align-items:center;flex:none}
.review-title{font-size:15px;line-height:20px;font-weight:700;color:var(--text);margin:9px 0 0}
.review-quote{font-size:14.5px;line-height:21px;color:var(--text-secondary);margin:9px 0 0}
.review-quote.tight{margin-top:5px}
/* Each card shows only where it fits whole: better two reviews read than three
   cut in half. A narrow screen wraps the headline onto another line, so what
   fits depends on width as well as height and the gates carry both: three fit
   from 844 on any phone 375 wide or more, but a 360 wraps the headline onto a
   third line and has to reach 890 to buy the same card back. Above 900 the
   roomier base sheet takes back more height than the taller screen gives, so
   the third waits again until 1080. Re-measure all of this whenever the
   headline changes length: it sits above the cards and spends their budget. */
@media (max-height:699px){
  .review-card + .review-card{display:none}
}
@media (max-height:735px) and (max-width:374px){
  .review-card + .review-card{display:none}
}
@media (max-height:843px){
  .review-card + .review-card + .review-card{display:none}
}
@media (max-height:889px) and (max-width:374px){
  .review-card + .review-card + .review-card{display:none}
}
@media (min-height:901px) and (max-height:1079px){
  .review-card + .review-card + .review-card{display:none}
}

/* calibration. The figure leads, the sentence explains it, the bar carries it,
   and the list of what is being switched on sits under the lot. */
.calib{display:flex;flex-direction:column;align-items:center;padding:0 30px;min-height:70vh;justify-content:center}
.calib-pct{font-size:66px;line-height:76px;font-weight:700;letter-spacing:-1px;margin:0}
.calib-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:10px 0 0}
.calib-bar{width:100%;height:8px;border-radius:999px;background:var(--progress-bg);overflow:hidden;margin-top:24px}
.calib-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .25s linear}
.calib-list{width:100%;margin-top:28px}
.calib-section{font-size:11px;letter-spacing:1px;margin:0 0 14px}
.calib-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
.calib-row .label{flex:1;font-size:14px;font-weight:500;color:var(--text-muted);transition:color .3s ease}
.calib-row.done .label{color:var(--text)}
/* Round, unlike the square box on a question. Nothing is being chosen here. */
.calib-tick{
  width:22px;height:22px;flex:none;border-radius:11px;background:var(--progress-bg);opacity:.5;
  display:flex;align-items:center;justify-content:center;transition:background .3s ease,opacity .3s ease;
}
.calib-row.done .calib-tick{background:var(--green);opacity:1}
/* The rating, under the bar. Rules either side of the stars so the row reads
   as a mark being awarded rather than as five loose shapes. */
.calib-proof{width:100%;margin-top:calc(18px + var(--air) * .8);text-align:center}
.calib-proof-count{font-size:13px;font-weight:700;letter-spacing:-.1px;margin:0}
.calib-proof .star-row{display:inline-flex;margin-top:6px}
.calib-proof .star-row::before,.calib-proof .star-row::after{
  content:"";align-self:center;width:clamp(22px,9vw,54px);height:1px;background:var(--rule)}
.calib-proof .star-row::before{margin-right:10px}
.calib-proof .star-row::after{margin-left:10px}
.calib-quote{font-size:13px;line-height:19px;color:var(--text-muted);margin:8px 0 0}
.calib-name{font-size:12px;font-weight:600;color:var(--text);margin:6px 0 0}

/* The fade over the top of the dock, so a scrolling body passes under the
   button rather than stopping dead against it. */
.dock{position:relative}
.scroll-fade{
  position:absolute;left:-22px;right:-22px;bottom:100%;height:28px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(250,245,236,0),var(--bg));
}
/* The citation sits above the button, set smaller than the body it cites. */
.cta-source{
  font-style:italic;text-align:center;color:var(--text-secondary);
  font-size:12px;line-height:17px;margin:14px 0 16px;padding:0 6px;
}

/* flagCard, the one thing on the page with a switch. */
.flag-card{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:22px;text-align:left;box-shadow:0 4px 14px rgba(26,34,56,.04);
}
.flag-card .label{flex:1;font-size:14.5px;font-weight:500}

/* plan */
.timeline{margin-top:24px;padding-left:6px}
.tl{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none}
.tl .line{width:2px;flex:1;margin:2px 0}
.tl .txt{flex:1;padding-bottom:14px}
.tl .txt b{display:block;font-size:15px;font-weight:700}
.tl .txt span{display:block;font-size:13px;color:var(--text-secondary);margin-top:2px;line-height:18px}
/* What the plan screen shows instead of the timeline when the store has no
   trial to give: the app's own subtitle and value list, ported as-is. */
.plan-sub{font-size:15px;line-height:22px;color:var(--text-secondary);text-align:center;margin:12px auto 0;max-width:300px}
.values{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.values div{display:flex;align-items:center;gap:12px}
.values i{width:28px;height:28px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.values span{flex-shrink:1;font-size:15px}
.plans{display:flex;gap:10px;margin-top:22px}
/* A column rather than a button's usual centred content, because the app
   top-aligns the card and a short card sitting level with a tall one is the
   whole point of showing them side by side. */
.plan{flex:1;display:flex;flex-direction:column;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;transition:background .18s ease,border-color .18s ease}
.plan.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* The mark sits against the whole stack, not just the name, so the price and
   the weekly figure line up under the name instead of under the mark. */
.plan .top{display:flex;align-items:center;gap:10px;width:100%}
.plan .col{flex:1;min-width:0;display:flex;flex-direction:column}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--border);flex:none}
.plan.on .radio{border-color:var(--accent);background:var(--accent)}
.plan .pname{font-size:15px;font-weight:700}
/* The day rate is the number on the card, so it carries the weight the term
   used to and the term drops back to a footnote under it. */
.plan .psub{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}
.plan.on .psub{color:#fff}
.plan .pweek{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.plan.on .pweek{color:rgba(255,255,255,.6)}
.plan .tagline{display:inline-block;background:var(--yellow);border-radius:999px;padding:4px 9px;margin-top:10px;font-size:10px;font-weight:700;color:var(--text)}
.legal{font-size:10.5px;line-height:15px;color:var(--text-muted);text-align:center;margin-top:11px}
/* flex-start so on a translation that wraps the mark stays on the first line
   rather than floating in the middle of the block. */
.reassure{display:flex;align-items:flex-start;justify-content:center;gap:8px}
.reassure svg{flex:none;margin-top:3px}
.reassure span{font-size:13.5px;font-weight:500;color:var(--green-text)}
/* Under the plans, and again against the button: the charge genuinely does not
   happen today on a trial, and the cancellation promise is the answer to the
   question the button asks, so it has to be on screen whenever the button is. */
.reassure.under{margin-top:16px}
.reassure.docked{margin-bottom:18px}

/* forms */
/* fieldInput. The app sets 15; the web sets 16, because anything smaller makes
   Safari zoom the page the moment the field takes focus. */
.input{
  width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;font-size:16px;font-weight:500;outline:none;transition:border-color .16s ease;
}
.input:focus{border-color:var(--navy)}
.input::placeholder{color:var(--text-faint);font-weight:400}
.forgot{display:block;width:100%;text-align:right;background:none;margin-top:14px;font-size:13px;font-weight:600;color:var(--accent)}
.otp{display:flex;gap:8px;margin:6px 0 2px;position:relative}
.otp b{flex:1;aspect-ratio:.82;background:#fff;border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.otp b.filled{border-color:var(--accent)}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:none}

/* authBtn, the three ways in. The shadow is the app's: barely there, and only
   enough to lift the white card off the paper. */
.auth-stack{display:flex;flex-direction:column;gap:11px}
.auth-btn{
  width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:15px 18px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:15px;font-weight:600;color:var(--text);box-shadow:0 2px 8px rgba(26,34,56,.04);
}
.auth-btn:active{transform:scale(.99)}
.auth-btn.dark{background:#000;border-color:#000;color:#fff}
.divider{display:flex;align-items:center;gap:12px;margin:26px 0}
.divider i{flex:1;height:1px;background:var(--rule)}
.divider span{flex-shrink:1;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--text-muted)}
.msg{background:var(--red-bg);color:var(--red-text);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.4;margin-bottom:14px}
.msg.ok{background:var(--green-bg);color:var(--green-text)}

/* The two fields sit in their own stack so the gap between them is one
   rule rather than a margin on every label. */
.fields{margin-top:28px;display:flex;flex-direction:column;gap:16px}
.fields .field-label{margin:0 0 8px}
/* The screen a code arrives on is titled smaller, and led by the disc. */
.step--email.sent h1.title{font-size:26px;margin-top:18px}
/* The reset code screen has no disc above its title, so it sits nearer the top. */
.step--email.sent.resetting h1.title{margin-top:8px}
.mail-mark{
  width:88px;height:88px;margin:8px auto 0;border-radius:44px;background:var(--green-bg);
  display:flex;align-items:center;justify-content:center;
}
.step--email .otp{margin:28px 0 0}
.step--email.resetting .otp{margin:24px 0 0}
.step--email .fields.tight{margin-top:22px}
.resend{margin-top:22px;text-align:center;font-size:13.5px;line-height:19px;color:var(--text-secondary)}
.resend button{background:none;font:inherit;font-weight:600;color:var(--accent)}
.resend button:disabled{color:var(--text-muted);font-weight:500}

/* hero and done */
/* HERO. The promise, then the product answering it. The handset is drawn to
   the same body, bezel, island and side buttons the native screen draws, at
   the same proportions, so what sits under the headline is the app itself
   rather than a picture of a phone. */
.hero{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-top) + 22px) 0 0;
}
.hero-head{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 28px}
/* Rise sets this at 30/33 and weight 400, which reads as a promise rather
   than a shout. DM Sans is a narrower face, so it holds the same air at 600. */
.hero h1{
  font-size:30px;line-height:34px;font-weight:600;letter-spacing:-.6px;
  margin:0;color:var(--text);max-width:15ch;
}
/* The app writes the handset as height 100% of the room left over, with the
   width falling out of the ratio and a 58% clamp then pulling the height back
   down with it. CSS will not read a percentage height off a box that is only
   sized by flex, and it holds the height when max-width bites instead of
   reshaping the box, so the handset is taken out of flow: the offsets give it
   the same definite height, the max-height restates the clamp in the one axis
   that keeps the ratio, and the auto margins centre it exactly as
   justifyContent does. */
.hero-phone-wrap{
  position:relative;flex:1;width:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;padding:20px 0 8px;
}
.hero-phone{
  position:absolute;top:20px;bottom:8px;left:50%;transform:translateX(-50%);
  height:auto;margin-top:auto;margin-bottom:auto;
  aspect-ratio:.467;max-width:58%;
  max-height:calc(min(100vw, var(--col)) * 0.58 / 0.467);
  border-radius:38px;padding:6px;background:var(--phone-body);
  display:flex;flex-direction:column;
}
.hero-phone-btn{position:absolute;width:3px;background:var(--phone-body);border-radius:2px}
.hero-phone-btn.l{left:-3px;border-top-right-radius:0;border-bottom-right-radius:0}
.hero-phone-btn.r{right:-3px;border-top-left-radius:0;border-bottom-left-radius:0}
.hero-phone-screen{flex:1;min-height:0;border-radius:32px;overflow:hidden;background:#000;display:flex;flex-direction:column}
.hero-phone-status{height:7.2%;flex:none;display:flex;align-items:center;justify-content:center;background:#0E0F12}
.hero-phone-island{width:32%;aspect-ratio:125/37;border-radius:999px;background:#000}
.hero-phone-video{flex:1;min-height:0;position:relative}
.hero-phone-video video,.hero-phone-video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Two cards, equal halves, drawn to Rise's own 157x175 at 390 wide: a 12px
   corner, a real edge, and a photograph wider than it is tall so the face
   sits in it rather than filling it. */
.pick-cards{display:flex;gap:13px;margin-top:30px}
.pick-card{
  flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.pick-card.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.pick-photo{display:block;width:100%;aspect-ratio:155/127;background:var(--paper-deep)}
.pick-photo img{display:block;width:100%;height:100%;object-fit:cover}
.pick-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 14px;height:46px;flex:none}
.pick-label{font-size:16px;font-weight:600;letter-spacing:-.2px}
.pick-go{
  width:30px;height:30px;flex:none;border-radius:15px;background:var(--navy);
  display:flex;align-items:center;justify-content:center;
}
.pick-card.on .pick-go{background:var(--accent)}
/* The answer that is not a picture. It is a real answer, so it stays on the
   screen, but it is not the one being asked for, so it is a link. */
.pick-skip{margin-top:18px;text-align:center}
.pick-skip .link{margin-top:0}
/* The button and the way past it. The account link sits under the button
   rather than beside it: a reader who already has one is not browsing. */
.hero-dock{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;padding:6px 24px 26px}
.hero-dock .link{margin-top:10px}
.hero-lang{
  position:absolute;top:8px;right:20px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border);background:#fff;
  font-size:14px;font-weight:500;color:var(--text-secondary);letter-spacing:.2px;
}
/* Nothing is docked on this screen, so the block owns the whole area and
   sits in the middle of it rather than hanging off the bottom. */
.done-wrap{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:100%}
.done-wrap .mark{width:88px;height:88px;border-radius:44px;background:var(--green-bg);display:flex;align-items:center;justify-content:center}
.done-wrap h1{font-size:30px;font-weight:700;letter-spacing:-.6px;margin:24px 0 0}
.done-wrap p{font-size:15px;line-height:22px;color:var(--text-secondary);margin:12px 0 0;max-width:280px}
/* The email is the one thing on this screen they have to carry into the
   app, so it gets a card of its own rather than a line in the paragraph. */
.done-acct{
  margin-top:18px;max-width:300px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--border);background:#fff;
}
.done-acct-label{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-secondary)}
.done-acct-email{display:block;margin-top:3px;font-size:15px;font-weight:600;word-break:break-all}
.done-stores{width:100%;max-width:320px;margin-top:26px;display:flex;flex-direction:column;gap:10px}

/* The legal footer has to be on the page, but it is not what anyone came for, so
   it is held to a single quiet strip and the flow keeps the rest of the height. */
.foot{
  flex:none;max-width:var(--col);width:100%;margin:0 auto;
  padding:6px 24px calc(var(--safe-bottom) + 8px);
  font-size:10px;line-height:1.5;color:var(--text-faint);text-align:center;
}
.foot a{color:var(--text-muted);text-decoration:none;margin:0 6px}
.foot p{margin:2px 0 0}

@media (max-width:360px){
  h1.title{font-size:25px}
  .big-number{font-size:56px}
  .hero h1{font-size:26px;line-height:31px}
  .step{padding-left:20px;padding-right:20px}
  .chrome,.dock{padding-left:20px;padding-right:20px}
}

/* Short viewports.
   Every screen here has to end at the button, because a funnel that asks the
   reader to scroll to find the button is a funnel that loses the ones who do
   not, so the design is drawn smaller rather than allowed to cut its last line
   off. What is left in here is only what --air cannot carry: type sizes, and
   the handful of paddings that are the same on every screen. Everything that
   is room between things, or the height of a figure, now grows with the
   viewport in the base rules above, so it has no step at this threshold.
   Verified scroll-free from 375 x 667, the shortest phone still in
   circulation. The two drawn charts carry their height in JS: chartHeight(). */
@media (max-height:900px){
  /* structure: the gutter above the title, the room under the button, the
     legal strip. None of it is content, so all of it gives first. */
  .chrome{padding-top:calc(var(--safe-top) + 24px);padding-bottom:10px}
  .dock{padding-top:8px;padding-bottom:calc(var(--safe-bottom) + 10px)}
  .cta-source{margin:8px 0 10px}
  .foot{padding-top:2px;padding-bottom:calc(var(--safe-bottom) + 2px);font-size:9.5px}
  .cta{height:52px}

  /* type */
  h1.title{font-size:23px;line-height:28px}
  .step--stakes h1.title{font-size:21px;line-height:27px}
  .step--feel h1.title,.step--habits h1.title,.step--upffreq h1.title,
  .step--additives h1.title{font-size:22px}
  .step--plan h1.title{font-size:22px}
  .step--account h1.title,.step--email h1.title{font-size:25px}
  .step--about h1.title{font-size:25px;line-height:31px}
  .step--reviews h1.title{font-size:25px;line-height:32px}
  .step--sym h1.title{font-size:24px;line-height:30px}
  .sub{font-size:14px;line-height:20px}
  .hint{margin-top:6px}
  .group-label{margin:10px 0 6px}
  .field-label{margin:14px 0 6px}
  .body-copy{margin-top:12px}

  /* answers. Their heights and the air between them now ride --air, which is
     already at its floor here, so only what does not scale is left. */
  .thumbs{gap:20px}
  .thumbs .thumb{gap:10px}
  .sym-counter{margin-bottom:8px}
  .count-ring{margin-top:16px}
  .disc{--d:34px}
  .check-row{padding:11px 14px;border-radius:18px}
  .check-sub{padding-top:6px}
  .chips--goals{gap:6px}
  .chip{padding:7px 15px 7px 7px}
  .chip--plain{padding:9px 16px;font-size:16px}
  .allergy-warning{padding:11px 13px;margin-top:14px}

  /* charts and figures */
  /* There is no height to give a bar on a short handset, so the width goes
     instead: at the floor a 64 wide track next to a 68 tall one is a square,
     and a square does not read as a measurement of anything. */
  .bar-track{width:54px}
  .legend-row{margin-top:6px}
  .ring-working{margin-top:10px}
  .statrow{gap:12px}
  .statrow b{font-size:46px;line-height:54px;letter-spacing:-1.1px}
  .statbody{font-size:14px;line-height:20px;margin-top:14px}
  .statworking{margin-top:12px}
  .caveat{font-size:12.5px;line-height:18px}
  .figure{margin-top:12px}
  .meal-grid{margin-top:12px}
  .ref-row{margin-top:14px;padding-top:12px}
  .ref-body{font-size:15px;line-height:21px}
  .ref-bar{margin-top:12px}
  .outcomes{margin-top:8px}
  .bar-value{font-size:22px;margin-bottom:6px}
  .bar-label{min-height:30px;margin-top:7px;font-size:12.5px;line-height:17px}
  .axis-block{margin-bottom:12px}
  .axis-track{margin-top:6px}
  .axis-source{margin-top:6px}
  .flag-card{padding:11px 14px;margin-top:12px}

  /* the bread comparison, the reviews, the plan */
  .compare{gap:10px;margin-top:12px}
  .slab .body{padding:10px 14px 12px}
  /* the two loaves are the picture, the two labels are the point, so on a short
     screen the photographs give up their height first and the modern list stays
     whole rather than ending mid-ingredient. */
  .slab img{flex:1 1 92px;min-height:40px}
  .proof-row{margin-top:5px}
  .avatar-cluster{height:58px}
  .review-card{padding:10px 13px;margin-top:6px;border-radius:17px}
  .review-title{margin-top:6px}
  .review-quote{font-size:13.5px;line-height:18px;margin-top:6px}
  .timeline{margin-top:14px}
  .tl .txt{padding-bottom:7px}
  .tl .txt span{line-height:17px}
  .plan-sub{margin-top:8px;line-height:20px}
  .values{margin-top:16px;gap:10px}
  .plans{margin-top:12px}
  .plan{padding:11px}
  /* The day rate can lose a point and stay the biggest number on the card. */
  .plan .psub{font-size:13px;margin-top:1px}
  .plan .pweek{margin-top:1px}
  .plan .tagline{margin-top:7px}
  .legal{margin-top:6px}
  .reassure.under{margin-top:6px}
  .reassure.docked{margin-bottom:10px}

  /* forms */
  .fields{margin-top:16px;gap:12px}
  .input{padding:11px 14px}
  .auth-stack{gap:9px}
  .auth-btn{padding:12px 16px}
  .divider{margin:16px 0}
  .forgot{margin-top:10px}
  .mail-mark{width:70px;height:70px;border-radius:35px}
  .step--email.sent h1.title{font-size:22px;margin-top:12px}
  .step--email .otp{margin-top:18px}
  .step--email.resetting .otp{margin-top:16px}
  .step--email .fields.tight{margin-top:14px}
  .resend{margin-top:14px}

  /* hero, calibration, done */
  .hero{padding-top:calc(var(--safe-top) + 14px)}
  .hero-head{padding-left:24px;padding-right:24px}
  .hero h1{font-size:26px;line-height:31px}
  .hero-phone-wrap{padding:14px 0 6px}
  .hero-phone{top:14px;bottom:6px}
  .hero-dock{padding:4px 22px 14px}
  .hero-dock .link{margin-top:8px}
  .pick-cards{gap:11px;margin-top:22px}
  .pick-foot{height:42px;padding:0 9px 0 12px}
  .pick-go{width:27px;height:27px;border-radius:14px}
  .pick-skip{margin-top:14px}
  .calib-pct{font-size:54px;line-height:62px}
  .calib-bar{margin-top:16px}
  .calib-list{margin-top:18px}
  .calib-section{margin-bottom:10px}
  .calib-row{padding:8px 0}
  .done-wrap h1{font-size:26px;margin-top:18px}
  .done-wrap p{margin-top:9px}
  .done-wrap .mark{width:72px;height:72px;border-radius:36px}
  .done-acct{margin-top:14px;padding:9px 14px}
  .done-stores{margin-top:20px}
}
</style>
</head>

     checkout only takes a typed card number and the whole point of asking is
     to offer the wallet first.

     It sits outside the app, because the layer the screens live in is animated
     and a fixed child of a transformed box is fixed to the box, not the window.
     It is written once and never rebuilt: Stripe draws the wallet inside an
     iframe, and an iframe that is rewritten or moved in the document reloads,
     so only its words are ever changed. -->
<div class="sheet off" id="paysheet" role="dialog" aria-label="Payment options">
  <div class="scrim" data-act="closepay"></div>

<script type="module">
/* ===================================================================
   Underneath, on the web.

   The app's onboarding, screen for screen: the same flow, the same copy
   out of src/i18n/en.ts, the same option lists out of
   src/constants/data.ts, the same arithmetic out of
   src/services/onboardingProfile.ts, and the same glyphs out of
   src/components/OnboardingIcon.tsx.

   What it writes into profiles.preferences is the SyncedPreferences
   shape src/services/preferences.ts reads back, so somebody who starts
   here and then installs the app is not asked anything twice.
   =================================================================== */

const SUPABASE_URL = "https://ufqqilewsnujxroesgqa.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcXFpbGV3c251anhyb2VzZ3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk5NTYsImV4cCI6MjA5ODA0NTk1Nn0.TYmTsPd1PKn3vhwndZ-YC3QXF20nq0zrPe43kUy1VHQ";
const RCB_PUBLIC_KEY = "rcb_gvdPeEGKdqZodEMqkpnyKytLdIyr"; // production Web Billing, charges real cards
const OTP_START = SUPABASE_URL + "/functions/v1/auth-otp-start";
const OTP_VERIFY = SUPABASE_URL + "/functions/v1/auth-otp-verify";
const STATE_KEY = "underneath_funnel_v3";
const DEVICE_KEY = "underneath_device_id";
const RC_ANON_KEY = "underneath_rc_anon_id";
const FBC_KEY = "underneath_fbc";
const FBP_KEY = "underneath_fbp";

/* ---- which ad sent them -------------------------------------------
   An ad click lands here as ?fbclid=..., and the pixel turns that into the
   _fbc cookie. The pixel is the first thing an ad blocker removes, so the
   click id is written down here by hand as well. Whatever survives to
   checkout is handed to RevenueCat, comes back on the purchase webhook, and
   is the only thing that can tell Meta which ad produced the trial. */
function readCookie(name) {
  const hit = document.cookie.split("; ").find((c) => c.startsWith(name + "="));
  return hit ? decodeURIComponent(hit.slice(name.length + 1)) : null;
}

try {
  const fbclid = new URLSearchParams(location.search).get("fbclid");
  if (fbclid) localStorage.setItem(FBC_KEY, "fb.1." + Date.now() + "." + fbclid);
} catch (e) { /* private mode, the cookie may still carry it */ }

function fbClickId() {
  const cookie = readCookie("_fbc");
  if (cookie) return cookie;
  try { return localStorage.getItem(FBC_KEY); } catch (e) { return null; }
}

/* The browser id is written by the pixel, so an ad blocker takes it along with
   everything else and the sale arrives carrying one identifier fewer. Making
   one by hand costs nothing, so the blocked half of the audience stops being
   the half we can say least about.

   Worth knowing what this is and is not. A click id we write ourselves is the
   real thing, because the value came from Meta in the URL. A browser id we
   write ourselves is only ever ours: Meta has no record of a pixel it never
   ran, so it matches no earlier visit. What it does is hold one person's
   events together across the funnel and count as another identifier on the
   sale. Smaller than the click id, and free.

   The cookie wins whenever it exists, so nobody whose pixel loaded normally
   gets a second identity. */
function fbBrowserId() {
  const cookie = readCookie("_fbp");
  if (cookie) return cookie;
  try {
    let made = localStorage.getItem(FBP_KEY);
    if (!made) {
      made = "fb.1." + Date.now() + "." + Math.floor(Math.random() * 1e10);
      localStorage.setItem(FBP_KEY, made);
    }
    return made;
  } catch (e) {
    return null; // private mode, nothing to persist it in
  }
}

/* ---- who they are, when there is no click id ----------------------
   Most visitors will not hand us a click id. The cookie gets blocked, the
   pixel gets stripped, or they came from somewhere that is not an ad at all.
   The address and the user agent are the pair Meta falls back on, and they

/** A glyph: solid, one ink, drawn inside the same optical square. */
function icon(name, size) {
  const paths = ICON_PATHS[name] || [];
  const d = paths.map((p) => `<path d="${p}" fill="${INK}" fill-rule="evenodd"/>`).join("");
  return `<svg class="ink" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
}
/** The white disc a glyph sits on. It stays white when its row inverts.
    The glyph is 0.52 of the disc, the ratio the app's Disc uses. */
function disc(name, size) {
  const d = size || 40;
  const g = Math.round(d * 0.52 * 10) / 10;
  const style = d === 40 ? "" : ` style="--d:${d}px"`;
  return `<span class="disc"${style}>${icon(name, g)}</span>`;
}

const DEFAULT_TRIPS = 156;
const TRIPS_BY_HABIT = { "Daily": 365, "A few times a week": 156, "Occasionally": 24, "Rarely": 6 };
const ITEMS_PER_TRIP = 12;
function shoppingTripsPerYear(habit) {
  const n = habit ? TRIPS_BY_HABIT[habit] : undefined;
  return n === undefined ? DEFAULT_TRIPS : n;
}
function groceryItemsPerYear(habit) { return shoppingTripsPerYear(habit) * ITEMS_PER_TRIP; }

const LIFE_YEARS_ANCHORS = {
  female: [[20, 10.7], [60, 8.0], [80, 3.4]],
  male: [[20, 13.0], [60, 8.8], [80, 3.4]],
};
const AGE_BY_BAND = { "18-29": 25, "30-39": 35, "40-49": 45, "50-59": 55, "60-69": 65, "70+": 75 };
const DEFAULT_AGE = 75;
function ageForBand(band) {
  const a = band ? AGE_BY_BAND[band] : undefined;
  return a === undefined ? DEFAULT_AGE : a;
}
function interpolate(anchors, age) {
  if (age <= anchors[0][0]) return anchors[0][1];
  const last = anchors[anchors.length - 1];
  if (age >= last[0]) return last[1];
  for (let i = 0; i < anchors.length - 1; i++) {
    const [x1, y1] = anchors[i];
    const [x2, y2] = anchors[i + 1];
    if (age <= x2) return y1 + ((y2 - y1) * (age - x1)) / (x2 - x1);
  }
  return last[1];
}
function lifeYearsAt(age, sex) {
  const female = interpolate(LIFE_YEARS_ANCHORS.female, age);
  const male = interpolate(LIFE_YEARS_ANCHORS.male, age);
  return sex === "female" ? female : sex === "male" ? male : (female + male) / 2;
}
function lifeYearsRegained(ageBand, sex) {
  return Math.max(1, Math.round(lifeYearsAt(ageForBand(ageBand), sex)));
}
/* Unrounded, so the marker sits on the line rather than near it. */
function lifeYearsRegainedRaw(ageBand, sex) {
  return lifeYearsAt(ageForBand(ageBand), sex);
}
function lifeYearsCurve(sex) {
  return LIFE_YEARS_ANCHORS.female.map(([age], i) => ({
    age,
    years:
      sex === "female" ? LIFE_YEARS_ANCHORS.female[i][1]
      : sex === "male" ? LIFE_YEARS_ANCHORS.male[i][1]
      : (LIFE_YEARS_ANCHORS.female[i][1] + LIFE_YEARS_ANCHORS.male[i][1]) / 2,
  }));
}

const MEALS_PER_WEEK = 21;
const UPF_MEALS_BY_FREQUENCY = { "Most meals": 15, "Once a day": 7, "A few times a week": 3, "Rarely": 1 };
/* "Not sure" is absent on purpose: it yields null, and the standing
   screen is then dropped from the flow rather than shown on a guess. */
function upfMealsPerWeek(frequency) {
  const n = frequency ? UPF_MEALS_BY_FREQUENCY[frequency] : undefined;
  return n === undefined ? null : n;
}
function upfMealsPerYear(mealsPerWeek) { return mealsPerWeek * 52; }
function standingApplies(frequency) { return upfMealsPerWeek(frequency) !== null; }

const PROJECTION_YEARS = 8;
const UPF_MEAL_WORST = 10;
const UPF_MEAL_BEST = 45;
const ORDINARY_MEAL_SCORE = 70;
const CHOSEN_MEAL_SCORE = 85;
const OWN_SCORE_CEILING = 65;
const DECLINE_PER_YEAR = 1.4;
const UPF_DECLINE_MULTIPLIER = 1.28; // JAMA Neurology 2022, ELSA-Brasil
const UPF_DECLINE_MIN_MEALS = MEALS_PER_WEEK * 0.2;
const UPF_DECLINE_AGE_LIMIT = 60;
const SWAPS_PER_YEAR = 6;
/* The same figure re-read as a rate. A swap only happens where a product is
   picked up, so the opportunity is a shopping trip, not a month on a calendar.
   Six a year was written against the default habit of 156 trips, so dividing
   by that recovers the rate it always implied rather than inventing a new one,
   and the median answer still lands on exactly six. */
const SWAPS_PER_TRIP = SWAPS_PER_YEAR / DEFAULT_TRIPS;
/* Floored because a reader changes meals they did not shop for too, and capped
   because what limits a swap is a better product being on that shelf, not the
   number of times the door opens. One a month is the most that is claimed. */
const SWAPS_PER_YEAR_MIN = 2;
const SWAPS_PER_YEAR_MAX = 12;
/* How often the shopping happens is already asked, and until now it only fed
   the count of items handled. It is the one other answer that bears on this
   chart honestly: it does not change how the week scores today, it changes how
   quickly the week can be changed. */
function swapsPerYear(habit) {
  const raw = shoppingTripsPerYear(habit) * SWAPS_PER_TRIP;
  return Math.min(SWAPS_PER_YEAR_MAX, Math.max(SWAPS_PER_YEAR_MIN, Math.round(raw)));
}

/* ---- the lightning round, read back ------------------------------------
   The frequency answer is one coarse band: "Once a day" is the same 7 meals
   whether the reader meant a sandwich or meant most of what they eat. The
   twelve yes and no answers are a second account of the same week from the
   same person, and the round already records a No as an answer given rather
   than a question skipped, so both directions can be read.

   They move the week WITHIN its band and no further. Two meals either way is
   narrower than the gap between any two frequency answers, so the round can
   sharpen where someone sits and can never move them into a band they did not
   pick. It is still their own report being read back, not a diagnosis: nothing
   here says a symptom was caused by food, and the screen says so too. */
const SYMPTOM_MEAL_SHIFT = 2;
/* Share of the round answered yes, or null when the round was not run. The
   denominator is the questions ANSWERED, so a reader who leaves partway
   through is read on what they gave rather than marked down for the rest. */
function symptomLoad(symptoms) {
  const answered = SYMPTOMS.filter((s) => typeof symptoms[s.key] === "boolean");
  if (answered.length === 0) return null;
  return answered.filter((s) => symptoms[s.key] === true).length / answered.length;
}
function symptomYesCount(symptoms) {
  return SYMPTOMS.filter((s) => symptoms[s.key] === true).length;
}
/* Centred on half, so an even split moves nothing and the round has to lean
   one way before it counts for anything. */
function symptomMealShift(load) {
  return load === null ? 0 : (load - 0.5) * 2 * SYMPTOM_MEAL_SHIFT;
}
/* Whole points. The projection is drawn AND read out, and a score is a whole
   number everywhere else in the product, so it is rounded at the source rather
   than at each of the places that prints it. */
const clampScore = (n) => Math.round(Math.max(0, Math.min(100, n)));
function weekScore(upfPerWeek) {
  const upf = Math.max(0, Math.min(MEALS_PER_WEEK, Math.round(upfPerWeek)));
  const share = upf / MEALS_PER_WEEK;
  const upfScore = UPF_MEAL_WORST + (UPF_MEAL_BEST - UPF_MEAL_WORST) * (1 - share);
  return upfScore * share + ORDINARY_MEAL_SCORE * (1 - share);
}
function healthScoreProjection({ upfPerWeek, age, averageUpfPerWeek, swaps = SWAPS_PER_YEAR, mealShift = 0, years = PROJECTION_YEARS }) {
  /* The frequency answer as the lightning round leaves it, before the ceiling
     is tested, so the round can move a reader across that line in either
     direction rather than being applied to a verdict already reached. */
  const reported = Math.max(0, Math.min(MEALS_PER_WEEK, upfPerWeek + mealShift));
  const own = weekScore(reported);
  const average = own > OWN_SCORE_CEILING;
  const meals = average ? averageUpfPerWeek : reported;
  const start = weekScore(meals);
  const fasterFall = meals >= UPF_DECLINE_MIN_MEALS && age < UPF_DECLINE_AGE_LIMIT;
  const fall = DECLINE_PER_YEAR * (fasterFall ? UPF_DECLINE_MULTIPLIER : 1);
  const closedPerYear = Math.min(1, swaps / MEALS_PER_WEEK);
  const declining = [];
  const improving = [];
  for (let y = 0; y <= years; y++) {
    declining.push(clampScore(start - fall * y));
    improving.push(clampScore(CHOSEN_MEAL_SCORE - (CHOSEN_MEAL_SCORE - start) * Math.pow(1 - closedPerYear, y)));
  }
  const last = years;
  /* Both readings of "how much you can improve", named rather than left to the
     screen to pick: against where the reader stands today, and against the
     same week left alone. They are different numbers and the copy says which
     is which. */
  return {
    start: clampScore(start),
    declining,
    improving,
    average,
    swaps,
    target: improving[last],
    gain: improving[last] - clampScore(start),
    gap: improving[last] - declining[last],
  };
}
function upfMealsAtShare(percent) { return Math.round((percent / 100) * MEALS_PER_WEEK); }

const UPF_REFERENCE_US = { region: "us", percent: 53 };
const UPF_REFERENCE_EUROPE = { region: "europe", percent: 27.2 };
function upfReference(countryCode) {
  return countryCode === "US" ? UPF_REFERENCE_US : UPF_REFERENCE_EUROPE;
}

   questions are still in SYMPTOMS, the screens still render, and the standing
   projection still reads any answers it finds, so putting it back is adding
   S.LIGHTNING, ...SYMPTOM_IDS here and SYMPTOM_IDS to PROGRESS_STEPS. Thirteen
   screens at the end of a quiz that had already been answered were thirteen
   more chances to close the tab. */
const FLOW = [
  S.HERO, S.SEX, S.ABOUT, S.YEARS, S.FEEL, S.SHOPFOR, S.HABITS,
  S.BADNEWS, S.UPFFREQ, S.UPFSHARE, S.GOALS, S.ADDITIVES, S.STAKES, S.COMPARE, S.DIET,
  S.ALLERGIES, S.CRED, S.REVIEWS, S.CALIB,
  /* The two lines are the last thing before the price, because they are the
     argument for paying: the gap between them is what the subscription is
     being sold to close. Asked earlier, mid-quiz, they were a fact; asked
     here, under a button that says try for free, they are the offer. */
  S.STANDING, S.PLAN, S.ACCOUNT, S.DONE,
];
/** What the progress bar counts: the questions. */
const PROGRESS_STEPS = [
  S.SEX, S.ABOUT, S.SHOPFOR, S.HABITS, S.UPFFREQ, S.GOALS, S.ADDITIVES,
  S.DIET, S.ALLERGIES,
];
/** No back button, no progress bar. */
const CHROMELESS = [S.HERO, S.LIGHTNING, S.CALIB, S.DONE];
/** Screens that move on by themselves. Stepping back onto one of these lands
    on a timer that immediately pushes forward again, which reads as a back
    button that does not work, so back steps over them. */
const AUTO_ADVANCE = [S.LIGHTNING, S.CALIB];

/* ---- where they stop ----------------------------------------------
   Twenty one screens stand between the ad and the card, and until now
   the only thing reported from any of them was the first. An ad that
   sent four hundred readers and sold nothing looked exactly like an ad
   that sent four hundred readers who all left on the hero, and there
   was no way to tell those apart.

   REVIEWS is the screen after the last question, so reaching it means
   the quiz was answered. PLAN is the screen with the price on it. The
   gap between those two numbers, and between them and the sale, is the
   whole drop off curve.

   Reported through our own /api/funnel rather than the pixel, for the
   same reason the sale is reported from the webhook: fbq is the first
   thing a blocker removes, and it removes it for exactly the readers we
   can otherwise say least about. */
const CHECKPOINTS = {
  [S.REVIEWS]: "Lead",
  [S.PLAN]: "InitiateCheckout",
};
const CHECKPOINT_KEY = "underneath_checkpoints";

/* Once per browser per checkpoint. Someone stepping back to change an
   answer has not arrived twice, and the event id is the same on a retry,
   so a cleared store cannot inflate the count either. */
function reportCheckpoint(screenId) {
  const event = CHECKPOINTS[screenId];
  if (!event) return;
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(CHECKPOINT_KEY) || "{}"); } catch (e) { /* ignore */ }
  if (seen[event]) return;
  seen[event] = true;
  try { localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(seen)); } catch (e) { /* private mode */ }
  try {
    fetch("/api/funnel", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      /* The next tap may close this page before the request is done, and
         the checkpoint is worth nothing if it only survives readers who
         hesitated. */
      keepalive: true,
      body: JSON.stringify({
        event,
        eventId: deviceId() + ":" + event,
        fbc: fbClickId(),
        fbp: fbBrowserId(),
      }),
    }).catch(() => { /* measuring the funnel is not the funnel */ });
  } catch (e) { /* ignore */ }
}

/* Per screen drop off, recorded in our own database rather than the pixel.
   The two checkpoints above are thirty one screens apart, so between them a
   reader who left on the first question and one who left on the last look the
   same. Twelve of those screens are the symptom round on its own.

   Not sent to Meta as custom events: only standard events can be optimised on,
   so thirty six of them would corrupt the signal the ad set is bidding with to
   buy a report we can run ourselves. */
const STEP_URL = SUPABASE_URL + "/functions/v1/funnel-step";
const STEP_KEY = "underneath_steps";

/* Once per browser per screen, for the same reason as the checkpoints: walking
   back to change an answer is not a second arrival. The server holds the same
   rule on a unique index, so a cleared store cannot inflate the count either. */
function reportStep(screenId, position) {
  if (!screenId) return;
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(STEP_KEY) || "{}"); } catch (e) { /* ignore */ }
  if (seen[screenId]) return;
  seen[screenId] = true;
  try { localStorage.setItem(STEP_KEY, JSON.stringify(seen)); } catch (e) { /* private mode */ }
  try {
    fetch(STEP_URL, {
      method: "POST",
      headers: fnHeaders(),
      /* The next tap may close this page before the request lands, and the
         readers who leave are the entire point of the measurement. */
      keepalive: true,
      body: JSON.stringify({ deviceId: deviceId(), screen: screenId, position }),
    }).catch(() => { /* measuring the funnel is not the funnel */ });
  } catch (e) { /* ignore */ }
}

/** The region of the browser's own locale, nothing more invasive. */
function guessCountry() {
  const tag = navigator.language || "en-US";
  try {
    const r = new Intl.Locale(tag).maximize().region;
    if (r) return r;
  } catch (e) { /* older engines, fall through */ }
  const m = /[-_]([A-Za-z]{2})\b/.exec(tag);
  return m ? m[1].toUpperCase() : "US";
}
function deviceId() {
  let d = null;
  try { d = localStorage.getItem(DEVICE_KEY); } catch (e) { /* private mode */ }
  if (!d) {
    d = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(16).slice(2);
    try { localStorage.setItem(DEVICE_KEY, d); } catch (e) { /* ignore */ }
  }
  return d;
}

const state = {
  i: 0,
  ageBand: null, sex: null, shopFor: null, habit: null, upfFrequency: null,
  goals: {}, additives: {}, diet: {}, allergies: {}, symptoms: {},
  flagUltraProcessed: true,
  plan: "annual",
  authMode: "signup", authStage: "methods", email: "", password: "",
  countryCode: guessCountry(), language: "en",
  prefsSaved: false, purchased: false, purchasedTrial: true,
};
try {
  const saved = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
  if (saved && typeof saved === "object") Object.assign(state, saved);
} catch (e) { /* a corrupt draft is not worth failing a launch over */ }
function save() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

/** STANDING is dropped whole when the answer was "Not sure": the model
    returns null there rather than guessing, so there is nothing to draw. */
function flow() {
  return FLOW.filter((id) => id !== S.STANDING || standingApplies(state.upfFrequency));
}

const layerEl = document.getElementById("layer");
const stepEl = document.getElementById("step");
const dockEl = document.getElementById("dock");
const dockBodyEl = document.getElementById("dockbody");
const xdockEl = document.getElementById("xdock");
const sheetEl = document.getElementById("paysheet");
const payTitleEl = document.getElementById("paytitle");
const payPriceEl = document.getElementById("payprice");
const payOrEl = document.getElementById("payor");
const payCardEl = document.getElementById("paycard");
const payLegalEl = document.getElementById("paylegal");
const chromeEl = document.getElementById("chrome");
