<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get started with Underneath</title>
<meta name="description" content="Set up Underneath in two minutes. Tell us your goals, create your account, and start your free trial." />
<meta name="robots" content="noindex" />

<meta name="theme-color" content="#86A36E" />

<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Sagepanel's two faces, identical to the landing page. Gliker is a Canva
     exclusive with no binary, so the marker face falls back to Grandstander
     exactly as the token stack does. -->
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Sagepanel tokens, verbatim, identical to the landing page. */
    --sp-canvas: #86A36E;
    --sp-canvas-deep: #6D8B54;
    --sp-canvas-tint: #93AE7C;
    --sp-panel: #1E3211;
    --sp-panel-raised: #2A4419;
    --sp-chip: #405C2D;
    --sp-leaf: #417121;

    --sp-ink: #FFFFFF;
    --sp-ink-soft: #DCE5D4;
    --sp-ink-dim: #A9BE96;

    /* Verdict, straight from the app, never retuned. On forest these are only
       ever used as fills behind white ink: as text colour they would not clear
       contrast against the panel. */
    --sp-good: #2F7D55;
    --sp-caution: #C8901A;
    --sp-poor: #BE4238;
    --sp-action: #D9571A;

    --font-display: "Gliker", "Grandstander", "Comfortaa", cursive;
    --font-body: "Poppins", "Commissioner", "Noto Sans", system-ui, sans-serif;

    --t-display-md: clamp(23px, 5.6vw, 34px);
    --t-body: clamp(15px, 4vw, 16.5px);
    --t-caption: clamp(12.5px, 3.3vw, 13.5px);
    --lead-display: 1.06;
    --lead-body: 1.45;

    --pad: clamp(22px, 6vw, 34px);
    --r-panel: clamp(26px, 5vw, 34px);
    --r-block: 18px;
    --r-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body);
    font-size: var(--t-body);
    line-height: var(--lead-body);
    background: var(--sp-canvas);
    color: var(--sp-ink-soft);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    overflow-x: hidden;
  }
  img { max-width: 100%; display: block; }
  /* Renamed from .field: start.html already uses .field for form rows. */
  .canvas-field {
    position: fixed; inset: 0; z-index: -1;
    width: 100%; height: 100%; pointer-events: none;
  }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 20px 16px 28px; }
  /* Rule 1: one panel, nothing readable outside it. No border, no shadow. */
  .card { background: var(--sp-panel); border-radius: var(--r-panel); padding: var(--pad); }

  .chrome {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
    min-height: 40px;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--sp-chip); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto; font-size: 17px; color: var(--sp-ink);
    padding: 0;
  }
  .back-btn:hover { background: var(--sp-leaf); }
  .progress { flex: 1; display: flex; gap: 4px; }
  .progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--sp-chip); }
  .progress span.on { background: var(--sp-action); }

  .hero-mark { width: 84px; height: 84px; border-radius: 24px; margin: 6px auto 20px; display: block; }
  .bubble {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; flex: 0 0 auto;
  }
  .bubble svg, .chip svg { display: block; }
  h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: var(--t-display-md); line-height: var(--lead-display);
    color: var(--sp-ink); letter-spacing: 0.01em; margin-bottom: 12px;
  }
  h1.center { text-align: center; }
  .sub { font-size: var(--t-body); color: var(--sp-ink-soft); margin-bottom: 22px; }
  .sub.center { text-align: center; }
  .sub b { color: var(--sp-ink); }
  .hint { font-size: var(--t-caption); color: var(--sp-ink-dim); margin-bottom: 16px; }
  .italic-note { text-align: center; color: var(--sp-ink-dim); font-size: var(--t-caption); margin-top: 22px; }

  .cta {
    width: 100%; padding: 17px 18px; font-size: 16px; font-weight: 600;
    font-family: inherit; color: #fff; background: var(--sp-action);
    border: none; border-radius: var(--r-pill); cursor: pointer; margin-top: 26px;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .cta:hover { filter: brightness(1.08); }
  .cta:active { transform: translateY(1px); }
  /* Fading orange to 0.4 muddied to brown against forest, so the disabled
     state takes a flat chip fill with dim ink instead. */
  .cta:disabled { background: var(--sp-chip); color: var(--sp-ink-dim); cursor: default; }
  .cta:disabled:hover { filter: none; }
  .link-btn {
    display: block; width: 100%; background: none; border: none;
    font-family: inherit; font-size: 14.5px; color: var(--sp-ink-dim);
    text-decoration: underline; cursor: pointer; margin-top: 16px; text-align: center;
  }

  /* Step cards (how it works). Raised blocks separate by colour, not border. */
  .step-card {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--sp-panel-raised); border-radius: var(--r-block); padding: 16px;
  }
  .step-card + .arrow { text-align: center; color: var(--sp-ink-dim); padding: 6px 0; font-size: 13px; }
  .step-icon {
    width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto;
    background: var(--sp-chip);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .step-card h3 { font-size: 16px; font-weight: 600; color: var(--sp-ink); margin-bottom: 3px; }
  .step-card p { font-size: 13.5px; color: var(--sp-ink-soft); line-height: 1.4; }

  /* Compare cards */
  .compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 6px; }
  .compare-card {
    background: var(--sp-panel-raised); border-radius: var(--r-block); padding: 14px;
  }
  /* Rule 8: verdict colours untouched, used as fills behind white ink. */
  .pill {
    display: inline-block; font-size: 11.5px; font-weight: 600; color: #fff;
    padding: 4px 10px; border-radius: var(--r-pill); margin-bottom: 10px;
  }
  .pill.green { background: var(--sp-good); }
  .pill.red { background: var(--sp-poor); }
  .compare-card p { font-size: 12.5px; line-height: 1.5; color: var(--sp-ink-soft); }
  .compare-img {
    display: block; width: 100%; height: 70px; border-radius: 10px;
    object-fit: cover; background: var(--sp-chip); margin: 2px 0 12px;
  }
  /* Apricot sticker accent, not a retuned poor red: red ink fails on forest. */
  .danger { color: #F0A854; font-weight: 500; }

  /* Stat bars */
  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 28px; height: 120px; margin: 26px 0 8px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; justify-content: flex-end; height: 100%; }
  .bar { width: 48px; border-radius: 8px; }
  .bar-label { font-size: 12px; color: var(--sp-ink-soft); text-align: center; }
  .chart-caption { text-align: center; font-size: 11px; letter-spacing: 1px; color: var(--sp-ink-dim); margin-bottom: 20px; }
  .source { font-size: 11px; color: var(--sp-ink-dim); line-height: 1.4; margin-top: 16px; }

  .flag-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--sp-panel-raised); border-radius: var(--r-block); padding: 16px;
  }
  .flag-card p { flex: 1; font-size: 14.5px; font-weight: 600; color: var(--sp-ink); line-height: 1.35; }
  .toggle {
    width: 52px; height: 30px; border-radius: var(--r-pill); background: var(--sp-chip);
    border: none; cursor: pointer; position: relative; flex: 0 0 auto;
    transition: background 0.15s ease; padding: 0;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    transition: left 0.15s ease;
  }
  .toggle.on { background: var(--sp-action); }
  .toggle.on::after { left: 25px; }

  /* Credibility */
  .cred-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px; margin-top: 8px;
  }
  .cred-card {
    background: var(--sp-panel-raised); border-radius: var(--r-block);
    padding: 16px 10px; text-align: center;
  }
  .cred-card b { display: block; font-family: var(--font-display); font-size: 19px; color: var(--sp-ink); margin-bottom: 4px; }
  .cred-card span { font-size: 12px; color: var(--sp-ink-soft); }
  .mono-note { text-align: center; font-size: 13px; color: var(--sp-ink-dim); margin-top: 22px; line-height: 1.5; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    background: var(--sp-chip); border: none; color: var(--sp-ink);
    padding: 9px 15px 9px 11px; border-radius: var(--r-pill); cursor: pointer;
    transition: background 0.12s ease;
  }
  .chip:hover { background: var(--sp-leaf); }
  .chip.on { background: var(--sp-leaf); }

  /* Radio rows */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row-btn {
    font-family: inherit; font-size: 15px; font-weight: 500; text-align: left;
    background: var(--sp-panel-raised); border: none; color: var(--sp-ink);
    padding: 15px 18px; border-radius: var(--r-block); cursor: pointer;
    transition: background 0.12s ease; display: flex; justify-content: space-between; align-items: center;
  }
  .row-btn:hover { background: var(--sp-chip); }
  .row-btn.on { background: var(--sp-leaf); }
  .row-btn .sub-label { font-size: 12px; color: var(--sp-ink-dim); font-weight: 400; }
  .row-btn.on .sub-label { color: rgba(255,255,255,0.78); }
  .row-left { display: flex; align-items: center; gap: 12px; }

  .warning {
    display: flex; gap: 10px; background: var(--sp-panel-raised); border: none;
    border-radius: var(--r-block); padding: 13px 14px; margin-top: 20px;
    font-size: 12.5px; color: var(--sp-ink-soft); line-height: 1.45;
  }

  /* Calibration */
  .calib { padding-top: 40px; }
  .calib-pct {
    display: block; text-align: center; font-family: var(--font-display);
    font-size: 46px; font-weight: 700; line-height: var(--lead-display);
    color: var(--sp-ink); font-variant-numeric: tabular-nums;
  }
  .calib-bar {
    height: 6px; border-radius: 3px; background: var(--sp-chip);
    overflow: hidden; margin-top: 20px;
  }
  .calib-fill { height: 100%; width: 0; background: var(--sp-action); transition: width 0.12s linear; }
  .calib-section {
    font-size: 11.5px; letter-spacing: 1px; font-weight: 600;
    color: var(--sp-ink-dim); margin: 30px 0 16px;
  }
  .calib-list { display: flex; flex-direction: column; gap: 13px; }
  .calib-row { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--sp-ink-dim); }
  .calib-row .bubble { flex: 0 0 auto; }
  .calib-row .calib-label { flex: 1; }
  .calib-row.done { color: var(--sp-ink); }
  .calib-tick {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--sp-chip); opacity: 0.6; transition: background 0.15s ease, opacity 0.15s ease;
  }
  .calib-tick svg { visibility: hidden; }
  .calib-row.done .calib-tick { background: var(--sp-good); opacity: 1; }
  .calib-row.done .calib-tick svg { visibility: visible; }

  /* Forms */
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 15px 17px; font-size: 16px; font-family: inherit;
    color: var(--sp-ink); background: var(--sp-panel-raised); border: none;
    border-radius: var(--r-block); outline: 2px solid transparent; outline-offset: 0;
    transition: outline-color 0.15s ease;
  }
  input::placeholder { color: var(--sp-ink-dim); }
  input:focus { outline-color: var(--sp-action); }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11.5px; letter-spacing: 1px; font-weight: 600;
    color: var(--sp-ink-dim); margin-bottom: 7px;
  }
  /* White pill so the Google mark reads at full colour. */
  .auth-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit; font-size: 15.5px; font-weight: 500;
    background: #fff; border: none; color: var(--sp-panel);
    padding: 15px 18px; border-radius: var(--r-pill); cursor: pointer; margin-bottom: 11px;
    transition: filter 0.15s ease;
  }
  .auth-btn:hover { filter: brightness(0.94); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.16); }
  .divider span { font-size: 11.5px; letter-spacing: 1px; color: var(--sp-ink-dim); font-weight: 600; }

  .otp-box {
    text-align: center; letter-spacing: 12px; font-size: 26px; font-weight: 600;
  }
  .msg { margin-top: 14px; font-size: 14.5px; line-height: 1.4; min-height: 20px; text-align: center; }
  .msg.ok { color: var(--sp-ink); }
  .msg.err { color: #F0A854; }

  /* Timeline */
  .timeline { margin: 22px 0 6px; }
  .tl-row { display: flex; gap: 14px; }
  .tl-rail { display: flex; flex-direction: column; align-items: center; }
  .tl-dot {
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .tl-line { width: 2px; flex: 1; background: var(--sp-chip); margin: 2px 0; }
  .tl-body { padding-bottom: 18px; }
  .tl-body b { font-size: 15px; display: block; color: var(--sp-ink); }
  .tl-body p { font-size: 13px; color: var(--sp-ink-soft); margin-top: 2px; line-height: 1.4; }

  /* Trial preview swap card */
  .trial-card { background: var(--sp-panel-raised); border: none; border-radius: var(--r-block); padding: 16px; margin-top: 22px; }
  /* The cleaner pick separates by colour, not by a border. */
  .trial-card.better { background: var(--sp-chip); }
  .trial-head { display: flex; align-items: center; gap: 11px; }
  .trial-thumb { width: 38px; height: 38px; border-radius: 11px; object-fit: cover; background: var(--sp-chip); flex: 0 0 auto; }
  .trial-name { flex: 1; min-width: 0; }
  .trial-name b { display: block; font-size: 14px; line-height: 1.25; color: var(--sp-ink); }
  .trial-name span { font-size: 11px; color: var(--sp-ink-dim); }
  /* Rule 5: the number never ships bare. Verdict is the fill, ink stays white. */
  .trial-score {
    font-family: var(--font-display); font-size: 18px; font-weight: 700; color: #fff;
    background: var(--sp-poor); border-radius: var(--r-pill); padding: 4px 13px;
    flex: 0 0 auto; line-height: 1.2;
  }
  .trial-score.good { background: var(--sp-good); }
  .trial-pills { display: flex; gap: 6px; margin-top: 14px; }
  .trial-pill { font-size: 11.5px; font-weight: 600; color: #fff; padding: 4px 10px; border-radius: var(--r-pill); }
  .trial-ings { margin-top: 14px; display: grid; gap: 9px; }
  .trial-ing { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--sp-ink-soft); }
  .trial-dot { width: 9px; height: 9px; border-radius: 5px; flex: 0 0 auto; }
  .trial-reveal {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 16px; background: var(--sp-chip); color: #fff; border: none; border-radius: var(--r-pill);
    padding: 12px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .trial-reveal:hover { background: var(--sp-leaf); }
  .trial-jump {
    background: var(--sp-good); border-radius: var(--r-block); padding: 12px; margin-top: 14px;
    text-align: center; font-size: 13px; font-weight: 600; color: #fff;
  }

  /* Score quiz */
  .quiz-opts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 4px; }
  .quiz-opt {
    font-family: inherit; text-align: left; cursor: pointer;
    background: var(--sp-panel-raised); border: none;
    border-radius: var(--r-block); padding: 12px; transition: background 0.12s ease;
  }
  .quiz-opt:hover { background: var(--sp-chip); }
  .quiz-opt img {
    display: block; width: 100%; height: 92px; border-radius: 11px;
    object-fit: cover; background: var(--sp-chip); margin-bottom: 11px;
  }
  .quiz-opt b { display: block; font-size: 13.5px; line-height: 1.25; color: var(--sp-ink); }
  .quiz-opt span { font-size: 11.5px; color: var(--sp-ink-dim); }

  /* Price anchor */
  .anchor-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    background: var(--sp-panel-raised); border: none;
    border-radius: var(--r-block); padding: 15px 16px; margin-bottom: 10px;
  }
  .anchor-row span { font-size: 14.5px; line-height: 1.35; color: var(--sp-ink-soft); }
  .anchor-row b { font-size: 14.5px; white-space: nowrap; color: var(--sp-ink); }
  .anchor-row.hi { background: var(--sp-leaf); }
  .anchor-row.hi span, .anchor-row.hi b { color: #fff; }

  /* Plans */
  .plans { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 20px; }
  .plan {
    font-family: inherit; text-align: left; cursor: pointer;
    background: var(--sp-panel-raised); border: none;
    border-radius: var(--r-block); padding: 16px; transition: background 0.12s ease;
  }
  .plan.on { background: var(--sp-leaf); }
  .plan b { display: block; font-size: 16px; color: var(--sp-ink); }
  .plan .price { font-size: 13.5px; color: var(--sp-ink-dim); margin-top: 2px; }
  .plan.on .price { color: rgba(255,255,255,0.78); }
  .plan .tag {
    display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 600;
    background: var(--sp-action); color: #fff; padding: 3px 9px; border-radius: var(--r-pill);
  }
  .trial-note { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 16px; font-size: 13.5px; color: var(--sp-ink); font-weight: 600; }
  .legal { font-size: 11.5px; color: var(--sp-ink-dim); line-height: 1.45; margin-top: 14px; text-align: center; }

  /* Done */
  .done-icon {
    width: 72px; height: 72px; border-radius: 50%; background: var(--sp-good);
    color: #fff; font-size: 32px; display: flex; align-items: center;
    justify-content: center; margin: 10px auto 22px;
  }
  .done-steps { text-align: left; margin: 24px auto 0; max-width: 380px; display: grid; gap: 13px; }
  .done-steps li { display: flex; gap: 12px; font-size: 15px; color: var(--sp-ink-soft); line-height: 1.4; list-style: none; }
  .done-steps .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--sp-action); margin-top: 7px; }

  .spinner {
    width: 34px; height: 34px; border-radius: 50%; margin: 40px auto;
    border: 3px solid var(--sp-chip); border-top-color: var(--sp-action);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Rule 1: the footer gets its own panel rather than sitting bare on sage. */
  footer {
    background: var(--sp-panel); border-radius: var(--r-panel);
    margin-top: 16px; padding: 22px var(--pad);
    text-align: center; font-size: 13px; color: var(--sp-ink-dim);
  }
  footer a { color: var(--sp-ink-soft); text-decoration: underline; }
  footer .legal { display: inline-block; margin-top: 10px; font-size: 12px; line-height: 1.5; }
  @media (max-width: 420px) {
    .compare, .quiz-opts { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
  <svg class="canvas-field" viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M0,120 C180,40 340,180 300,340 C265,480 60,470 0,380 Z" fill="#6D8B54"/>
    <path d="M1080,760 C900,700 860,940 980,1060 C1040,1120 1080,1140 1080,1140 Z" fill="#93AE7C"/>
    <path d="M700,1350 C700,1180 900,1140 1010,1230 C1090,1296 1080,1350 1080,1350 Z" fill="#6D8B54"/>
  </svg>
  <div class="wrap">
    <main class="card">
      <div class="chrome" id="chrome" style="display:none">
        <button class="back-btn" id="backBtn" aria-label="Back">&#8592;</button>
        <div class="progress" id="progress"></div>
      </div>
      <div id="view"></div>
    </main>
    <footer>
      <a href="/privacy">Privacy</a> &middot;
      <a href="/terms">Terms</a><br />
      <span class="legal">
        UNDERNEATH LTD &middot; Company number 17312263 &middot; Registered office: 128 City Road, London, EC1V 2NX, United Kingdom &middot;
        <a href="mailto:tryunderneath@gmail.com">tryunderneath@gmail.com</a>
      </span>

  function setMsg(text, kind) {

  async function startEmail() {
    if (authBusy) return;
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pw = document.getElementById("pw").value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg("Please enter a valid email address.", "err"); return; }
    if (state.authMode === "signup" && pw.length < 8) { setMsg("Password must be at least 8 characters.", "err"); return; }
    if (!pw) { setMsg("Please enter your password.", "err"); return; }
    authBusy = true;
    setMsg("Sending your code...", "");
    try {
      const res = await fetch(OTP_START, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-device-id": deviceId(),
          apikey: ANON_KEY,
          Authorization: "Bearer " + ANON_KEY,
        },
        body: JSON.stringify({ email, password: pw, purpose: state.authMode }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.existing_account) {
        state.authMode = "login";
        save(); renderAccount();
        setMsg("You already have an account with this email. Please sign in.", "err");
        return;
      }
      if (res.ok && data.ok) {
        state.email = email;
        save();
        pendingPw = pw;
        go("code");
        return;
      }
      if (res.status === 401) { setMsg("Wrong email or password.", "err"); return; }
      if (res.status === 429) { setMsg("Too many attempts. Please try again a bit later.", "err"); return; }
      setMsg("Something went wrong. Please try again.", "err");
    } catch (e) {
      setMsg("Network error. Please try again.", "err");
    } finally {
      authBusy = false;
    }
  }

  function renderCode() {
    let cooldown = 30;
    view.innerHTML = `
      <h1 class="center">Enter your code.</h1>

    const codeInput = document.getElementById("code");
    const cta = document.getElementById("cta");
    const resendBtn = document.getElementById("resendBtn");
    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);

      if (codeInput.value.length === 6) verifyCode(codeInput.value);
    });
    if (resendTimer) clearInterval(resendTimer);
    resendTimer = setInterval(() => {
      cooldown -= 1;
      if (cooldown <= 0) {
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = "Resend code";
      } else {
        resendBtn.textContent = "Resend code in " + cooldown + "s";
      }
    }, 1000);
    resendBtn.addEventListener("click", async () => {
      if (!pendingPw) { go("account"); return; }
      resendBtn.disabled = true;
      try {
        await fetch(OTP_START, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-device-id": deviceId(), apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY },
          body: JSON.stringify({ email: state.email, password: pendingPw, purpose: state.authMode }),
        });

      } catch (e) { setMsg("Network error. Please try again.", "err"); }

  async function verifyCode(code) {
    if (authBusy || code.length !== 6) return;
    authBusy = true;
    setMsg("Verifying...", "");
    try {
      const res = await fetch(OTP_VERIFY, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-device-id": deviceId(),
          apikey: ANON_KEY,
          Authorization: "Bearer " + ANON_KEY,
        },
        body: JSON.stringify({ email: state.email, code, purpose: state.authMode }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.access_token) {
        const { error } = await db.auth.setSession({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
        });
        if (error) { setMsg("Could not start your session. Please try again.", "err"); return; }
        await afterAuth();
        return;
      }
      if (res.status === 429) { setMsg("Too many attempts. Please try again a bit later.", "err"); return; }
      if (data.error === "expired") { setMsg("That code expired. Tap resend to get a new one.", "err"); return; }
      setMsg("That code is not correct.", "err");
      const codeInput = document.getElementById("code");
      if (codeInput) { codeInput.value = ""; codeInput.focus(); document.getElementById("cta").disabled = true; }
    } catch (e) {
      setMsg("Network error. Please try again.", "err");
    } finally {
      authBusy = false;
    }
  }

    const { error } = await db.from("profiles").update({ preferences: prefs }).eq("id", user.id);

      await new Promise((r) => setTimeout(r, 1500));
      await db.from("profiles").update({ preferences: prefs }).eq("id", user.id);
    }

    save();
    go("timeline");
  }

  async function startCheckout() {
    if (authBusy) return;
    authBusy = true;
    const cta = document.getElementById("cta");
    cta.disabled = true;
    setMsg("Opening secure checkout...", "");
    try {
      const { data } = await db.auth.getUser();
      const user = data && data.user;
      if (!user) { authBusy = false; go("account"); return; }

      const { Purchases } = await import("https://esm.sh/@revenuecat/purchases-js");
      let purchases;
      try {
        purchases = Purchases.configure(RCB_PUBLIC_KEY, user.id);
      } catch (e) {
        purchases = Purchases.getSharedInstance();
      }
      const offerings = await purchases.getOfferings();
      const offering = offerings.current;
      if (!offering) throw new Error("no_offering");
      const wantId = state.plan === "annual" ? "$rc_annual" : "$rc_weekly";
      const pkg = (offering.availablePackages || []).find((p) => p.identifier === wantId);
      if (!pkg) throw new Error("no_package");

      await purchases.purchase({ rcPackage: pkg, customerEmail: user.email || undefined });
      state.purchased = true;
      save();
      go("done");
    } catch (e) {
      const msg = (e && (e.message || String(e))) || "";
      if (/cancel|closed|dismiss/i.test(msg) || (e && e.errorCode === 1)) {
        setMsg("Checkout was closed. Pick a plan when you're ready.", "");
      } else if (/no_offering|no_package/.test(msg)) {
        setMsg("Plans are not available right now. Please try again shortly.", "err");
      } else {
        setMsg("Checkout could not start. Please try again.", "err");
      }
      const btn = document.getElementById("cta");
      if (btn) btn.disabled = false;
    } finally {
      authBusy = false;
    }
  }

    chrome.style.display = "none";
    view.innerHTML = `
      <div class="done-icon">&#10003;</div>
      <h1 class="center">You're all set.</h1>
      <p class="sub center">Your free trial is active and your preferences are saved to your account.</p>
      <ul class="done-steps">
        <li><span class="dot"></span>Download Underneath from the App Store or Google Play.</li>
        <li><span class="dot"></span>Open the app and sign in with this same account.</li>
        <li><span class="dot"></span>Start scanning. Your goals and filters are already applied.</li>
      </ul>
    `;
    try { localStorage.removeItem(STATE_KEY); } catch (e) {}
  }

  // ── Boot: resume after OAuth redirect or page reload ──
  async function boot() {
    view.innerHTML = '<div class="spinner"></div>';
    // Let supabase-js parse an OAuth redirect from the URL if present.
    const { data } = await db.auth.getSession();
    const session = data && data.session;
    if (session) {
      if (state.purchased) { renderDone(); return; }
      if (state.prefsSaved) { go("timeline"); return; }
      await afterAuth();
      return;
    }
    render();
  }
  boot();
</script>
</body>
</html>
