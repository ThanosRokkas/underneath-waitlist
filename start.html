const barEl = document.getElementById("bar");

/* ---- small builders the screens share ------------------------------ */
/* The citation is held out of the scroll and sat on the button, exactly as
   the app's CTA does it: a claim and the paper it rests on belong on screen
   together, and a source that scrolls away is one the reader has to go
   looking for to check. */
function cta(label, disabled, act, source) {
  return `${source ? `<p class="cta-source">${esc(source)}</p>` : ""}<button class="cta" type="button" data-act="${act || "next"}"${disabled ? " disabled" : ""}>${esc(label)}</button>`;
}

/* One ticked reassurance, as the app draws it. The mark is aligned to the top
   of the text rather than its middle, so on a translation that wraps it stays
   on the first line instead of floating in the middle of the block. */
function reassure(text, mod) {
  return `<div class="reassure ${mod || ""}">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="7" stroke="#3E9C6D" stroke-width="1.6"/>
      <path d="M5 8l2 2 4-4.4" stroke="#3E9C6D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>${esc(text)}</span>
  </div>`;
}

/* ---- the star and the wreath ---------------------------------------- */
/**
 * One five-pointed star, filled with a top-down gold gradient rather than a
 * flat colour, which is what stops a row of five reading as clip art.
 */
function star(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4l-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z" fill="url(#starGold)"/>
  </svg>`;
}
function starRow(size, gap) {
  return `<span class="star-row" style="gap:${gap}px" aria-label="5 out of 5">${
    [0, 1, 2, 3, 4].map(() => star(size)).join("")}</span>`;
}

const LAUREL_GOLD = "#D9A441";
/**
 * One leaf, pointed at both ends, growing from (bx, by) at an angle where zero
 * is straight up and a positive angle turns clockwise. Two curves out and back,
 * which is all a laurel leaf is.
 */
function laurelLeaf(bx, by, deg, len, w) {
  const r = (deg * Math.PI) / 180;
  const ax = Math.sin(r), ay = -Math.cos(r);
  const px = Math.cos(r), py = Math.sin(r);
  const at = (along, across) =>
    `${(bx + ax * along + px * across).toFixed(1)} ${(by + ay * along + py * across).toFixed(1)}`;
  return [
    `M${bx.toFixed(1)} ${by.toFixed(1)}`,
    `C${at(len * 0.3, w)} ${at(len * 0.72, w)} ${at(len, 0)}`,
    `C${at(len * 0.72, -w)} ${at(len * 0.3, -w)} ${bx.toFixed(1)} ${by.toFixed(1)}`,
  ].join(" ");
}
/**
 * Half a wreath, built rather than drawn: one curve for the branch, and at
 * eight points along it a pair of leaves set forty-two degrees either side of
 * the direction the branch is running. That pairing is what makes the chevrons
 * a wreath is read by, and taking the angle off the curve is what keeps them
 * turning with it instead of all pointing the same way. There is no line under
 * the leaves: the bases meet along the curve and the overlap draws the branch.
 */
const LAUREL_CURVE = [[30, 94], [0, 78], [-2, 28], [26, 2]];
const LAUREL_PATHS = (() => {
  const [p0, p1, p2, p3] = LAUREL_CURVE;
  return [0.05, 0.17, 0.29, 0.41, 0.53, 0.65, 0.77, 0.89].flatMap((tt) => {
    const u = 1 - tt;
    const on = (i) => u * u * u * p0[i] + 3 * u * u * tt * p1[i] + 3 * u * tt * tt * p2[i] + tt * tt * tt * p3[i];
    const d = (i) => 3 * u * u * (p1[i] - p0[i]) + 6 * u * tt * (p2[i] - p1[i]) + 3 * tt * tt * (p3[i] - p2[i]);
    const deg = (Math.atan2(d(0), -d(1)) * 180) / Math.PI;
    /* The leaves shorten toward the tip, which is what stops the branch
       reading as a ladder of identical rungs. */
    const len = 20 - tt * 6;
    return [
      laurelLeaf(on(0), on(1), deg - 42, len, len * 0.3),
      laurelLeaf(on(0), on(1), deg + 42, len, len * 0.3),
    ];
  });
})();
function laurelHalf(height) {
  const w = (height * 58) / 108;
  return `<svg width="${w}" height="${height}" viewBox="-17 -8 58 108" aria-hidden="true">${
    LAUREL_PATHS.map((d) => `<path d="${d}" fill="${LAUREL_GOLD}"/>`).join("")}</svg>`;
}
/** The wreath and what it is around: two mirrored halves with the claim between. */
function wreath(height, inner) {
  return `<span class="wreath">${laurelHalf(height)}<span class="wreath-mid">${inner}</span><span class="wreath-flip">${laurelHalf(height)}</span></span>`;
}

/* ---- charts --------------------------------------------------------- */
/* The app sizes its plots in points off the window, not in percentages, so
   the same arithmetic runs here. CHART_W is the card's inner width: the
   column, less the step's gutters, less the card's own padding. */
function chartWidth() {
  return Math.min(window.innerWidth, 420) - 48 - 36;
}
/* A chart is the one thing on these screens that can honestly take whatever
   room is left, so it is measured off the room rather than picked from two
   numbers. 118 is the height verified to fit a 667pt handset, and the surplus
   above 700 is shared with it at a third, so the shortest phone is unchanged
   by construction and everything taller stops leaving a chart stranded in the
   top half of an empty card. The cap is where a line chart stops reading as
   a trend and starts reading as a wall. */
function chartHeight(base, max) {
  return Math.round(Math.min(max, base + Math.max(0, window.innerHeight - 700) * 0.3));
}
/**
 * A curve through the given points rather than a run of straight segments.
 * Catmull-Rom control points converted to cubic beziers, with the tension held
 * low so the line stays inside the data: the published anchors are the claim,
 * and a curve that overshoots them would be drawing years nobody measured.
 */
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const k = 0.5 / 3;
    d += ` C${p1.x + (p2.x - p0.x) * k} ${p1.y + (p2.y - p0.y) * k}, ${p2.x - (p3.x - p1.x) * k} ${p2.y - (p3.y - p1.y) * k}, ${p2.x} ${p2.y}`;
  }
  return d;
}
/* The drawing is uncovered left to right by a panel in the card's own colour,
   so the line, the area under it, the dots on it and the labels beside it are
   all revealed by one pass, in step, whatever any of them is made of. */
function sweep(w, h, inner) {
  return `<div class="sweep" style="width:${w}px;height:${h}px">${inner}<i class="curtain" style="width:${w + 2}px;height:${h}px"></i></div>`;
}
/* chartCard: soft rather than ruled, and the caption waits for the drawing. */
function chartCard(title, inner, caption) {
  return `<div class="chart">
    ${title ? `<h2>${esc(title)}</h2>` : ""}
    ${inner}
    ${caption ? `<p class="chart-caption late">${esc(caption)}</p>` : ""}
  </div>`;
}

/**
 * The life expectancy model, drawn instead of asserted. The line runs through
 * the three ages the paper publishes and the marker sits on that same line, so
 * the reader can see both the number they were given and how it was picked.
 */
function lifeYearsChart(curve, markerAge, markerYears) {
  const W = chartWidth();
  const H = chartHeight(118, 250);
  const padL = 4, padR = 4, padB = 26, padT = 16;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const X_MIN = 20, X_MAX = 80;
  /* Half a year of headroom above the highest published anchor, 13.0. */
  const Y_MAX = 13.5;
  const x = (age) => padL + ((age - X_MIN) / (X_MAX - X_MIN)) * plotW;
  const y = (years) => padT + (1 - years / Y_MAX) * plotH;
  const anchors = curve.map((p) => ({ x: x(p.age), y: y(p.years) }));
  /* Read every year rather than every published anchor: rounding three points
     into a curve would bow the line away from the figure printed above it. */
  const pts = [];
  for (let age = X_MIN; age <= X_MAX; age += 1) {
    let years = curve[curve.length - 1].years;
    if (age <= curve[0].age) years = curve[0].years;
    else {
      for (let i = 1; i < curve.length; i++) {
        if (age <= curve[i].age) {
          const a = curve[i - 1], b = curve[i];
          years = a.years + ((b.years - a.years) * (age - a.age)) / (b.age - a.age);
          break;
        }
      }
    }
    pts.push({ x: x(age), y: y(years) });
  }
  const line = smoothPath(pts);
  const base = padT + plotH;
  const area = `${line} L${pts[pts.length - 1].x} ${base} L${pts[0].x} ${base} Z`;
  const mx = x(Math.min(X_MAX, Math.max(X_MIN, markerAge)));
  const my = y(markerYears);
  const svg = `<svg width="${W}" height="${H}" aria-hidden="true">
      <defs><linearGradient id="lifeFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E9C6D" stop-opacity=".26"/>
        <stop offset="1" stop-color="#3E9C6D" stop-opacity=".02"/>
      </linearGradient></defs>
      ${[0, 5, 10].map((g) => `<line x1="${padL}" y1="${y(g)}" x2="${padL + plotW}" y2="${y(g)}" stroke="#ECE6DA" stroke-width="1"/>`).join("")}
      <path d="${area}" fill="url(#lifeFill)"/>
      <path d="${line}" stroke="#3E9C6D" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      ${anchors.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="#3E9C6D" stroke-width="2.6"/>`).join("")}
      <circle cx="${mx}" cy="${my}" r="11" fill="#3E9C6D" opacity=".16"/>
      <circle cx="${mx}" cy="${my}" r="6.5" fill="#2E7D52" stroke="#fff" stroke-width="2.4"/>
    </svg>`;
  /* The end ages sit on the very edge of the plot, so a label centred on them
     hangs half outside the chart. Holding the box inside moves those two in by
     a few points, which is invisible, where losing a digit is not. */
  const ticks = [20, 40, 60, 80].map((a) =>
    `<span class="axis-tick" style="left:${Math.min(Math.max(x(a) - 16, 0), W - 32)}px;width:32px;top:${H - 14}px">${a}</span>`).join("");
  return sweep(W, H, svg + ticks);
}

/**
 * One week scored out of a hundred, drawn two ways from the same starting
 * score: left alone, and changed one meal at a time. The drawing's only job of
 * its own is to keep a hundred at the top of the axis whatever was answered.
 */
function scoreProjectionChart(declining, improving, labelNow, labelEnd) {
  const W = chartWidth();
  const H = chartHeight(118, 248);
  const padL = 4;
  /* Room at the right for each line to carry its own end score. */
  const padR = 50, padT = 14, padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const last = declining.length - 1;
  const x = (w) => padL + (w / last) * plotW;
  const y = (score) => padT + (1 - score / 100) * plotH;
  const decliningPath = smoothPath(declining.map((s, w) => ({ x: x(w), y: y(s) })));
  const improvingPath = smoothPath(improving.map((s, w) => ({ x: x(w), y: y(s) })));
  const base = y(0);
  const improvingArea = `${improvingPath} L${x(last)} ${base} L${x(0)} ${base} Z`;
  const decliningArea = `${decliningPath} L${x(last)} ${base} L${x(0)} ${base} Z`;
  const svg = `<svg width="${W}" height="${H}" aria-hidden="true">
      <defs>
        <linearGradient id="improveFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3E9C6D" stop-opacity=".3"/>
          <stop offset="1" stop-color="#3E9C6D" stop-opacity=".06"/>
        </linearGradient>
        <linearGradient id="heldFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E5564E" stop-opacity=".2"/>
          <stop offset="1" stop-color="#E5564E" stop-opacity=".05"/>
        </linearGradient>
      </defs>
      ${[0, 50, 100].map((g) => `<line x1="${padL}" y1="${y(g)}" x2="${padL + plotW}" y2="${y(g)}" stroke="#ECE6DA" stroke-width="1"/>`).join("")}
      <path d="${improvingArea}" fill="url(#improveFill)"/>
      <path d="${decliningArea}" fill="#FFFFFF"/>
      <path d="${decliningArea}" fill="url(#heldFill)"/>
      <path d="${decliningPath}" stroke="#E5564E" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${improvingPath}" stroke="#3E9C6D" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(0)}" cy="${y(declining[0])}" r="6" fill="#1A2238" stroke="#fff" stroke-width="2.4"/>
      <circle cx="${x(last)}" cy="${y(declining[last])}" r="6" fill="#C0392F" stroke="#fff" stroke-width="2.4"/>
      <circle cx="${x(last)}" cy="${y(improving[last])}" r="6" fill="#2E7D52" stroke="#fff" stroke-width="2.4"/>
    </svg>
    <span class="line-end" style="color:#2E7D52;top:${y(improving[last]) - 11}px;right:0">${improving[last]}</span>
    <span class="line-end" style="color:#C0392F;top:${y(declining[last]) - 11}px;right:0">${declining[last]}</span>
    <span class="axis-tick" style="left:${padL}px;top:${H - 12}px">${esc(labelNow)}</span>
    <span class="axis-tick" style="left:0;width:${x(last) + 20}px;top:${H - 12}px;text-align:right">${esc(labelEnd)}</span>`;
  return sweep(W, H, svg);
}

/* A repeatable drift, so a mark lands the same way on every reload but no two
   marks land alike. A hash rather than Math.random for exactly that reason. */
function wobble(seed) {
  let n = (seed * 2654435761) >>> 0;
  n ^= n >>> 15;
  n = Math.imul(n, 2246822519);
  n ^= n >>> 13;
  return (n >>> 0) / 4294967296;
}
/* Density is a shared property, not a per-mark one: a field of thousands is
   drawn as a handful of paths, and everything in one path is one colour. */
const INK_STEPS = 8, INK_MIN = 0.42, INK_SPAN = 0.3;
function inkOpacity(step) { return INK_MIN + ((step + 0.5) / INK_STEPS) * INK_SPAN; }
/** One round mark as path data, so a whole field costs a handful of elements. */
function dotPath(cx, cy, r) {
  return `M${(cx - r).toFixed(1)} ${cy.toFixed(1)}a${r.toFixed(1)} ${r.toFixed(1)} 0 1 0 ${(r * 2).toFixed(1)} 0a${r.toFixed(1)} ${r.toFixed(1)} 0 1 0 -${(r * 2).toFixed(1)} 0Z`;
}
/**
 * The year's groceries, one mark each, stamped by hand and broken into fives so
 * the block can actually be counted rather than just felt. The count is the
 * reader's own answer, so the field is a picture of what they said.
 */
function fivesBlock(count, size, colsOverride) {
  const GROUP = 5, GUTTER_RATIO = 0.62, MAX_PITCH = 19;
  const CHART_W = chartWidth() + 36; /* the app measures this one off the page, not a card */
  const cols = colsOverride || (count <= 30 ? 10 : count <= 60 ? 15 : count <= 200 ? 20 : 25);
  const rows = Math.ceil(count / cols);
  const gutsX = cols / GROUP - 1;
  const gutsY = Math.ceil(rows / GROUP) - 1;
  const pitch = Math.min(MAX_PITCH, CHART_W / (cols + gutsX * GUTTER_RATIO));
  const gutter = pitch * GUTTER_RATIO;
  const r = Math.min(size, pitch * 0.28);
  const W = cols * pitch + gutsX * gutter;
  const H = rows * pitch + gutsY * gutter;
  const inks = new Array(INK_STEPS).fill("");
  for (let i = 0; i < count; i++) {
    const c = i % cols;
    const row = Math.floor(i / cols);
    const jx = (wobble(i * 3 + 1) - 0.5) * pitch * 0.2;
    const jy = (wobble(i * 3 + 2) - 0.5) * pitch * 0.2;
    const jr = r * (0.84 + wobble(i * 3 + 3) * 0.32);
    const cx = pitch / 2 + c * pitch + Math.floor(c / GROUP) * gutter + jx;
    const cy = pitch / 2 + row * pitch + Math.floor(row / GROUP) * gutter + jy;
    inks[Math.min(INK_STEPS - 1, Math.floor(wobble(i * 7 + 5) * INK_STEPS))] += dotPath(cx, cy, jr);
  }
  return `<svg width="${W}" height="${H}" aria-hidden="true">${
    inks.map((d, step) => d ? `<path d="${d}" fill="var(--red)" opacity="${inkOpacity(step).toFixed(3)}"/>` : "").join("")
  }</svg>`;
}
/* Columns chosen so a block lands at roughly one height whatever the count, so
   what changes between two answers is the density, which is the point. */
const ITEM_BLOCK_H = 258;
function itemBlockCols(count) {
  const CHART_W = chartWidth() + 36;
  const cell = Math.sqrt((CHART_W * ITEM_BLOCK_H) / count);
  return Math.max(10, Math.min(90, Math.round(CHART_W / cell / 5) * 5));
}
/**
 * The arrow carries the direction and the ink carries the verdict, so a washed
 * capsule around them would add nothing but the look of a stock badge.
 */
function arrowGlyph(good) {
  const d = good ? "M6 2v8M6 10L2.5 6.5M6 10l3.5-3.5" : "M6 10V2M6 2L2.5 5.5M6 2l3.5 3.5";
  return `<svg width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/** A count read aloud in the reader's own locale, thousands separator and all. */
function formatCount(n) {
  try { return new Intl.NumberFormat(navigator.language || "en-US").format(n); }
  catch (e) { return String(n); }
}

function link(label, act, attrs) {
  return `<button class="link" type="button" data-act="${act}" ${attrs || ""}>${esc(label)}</button>`;
}
function chip(label, on, field, value) {
  return `<button class="chip${on ? " on" : ""}" type="button" role="radio" aria-checked="${on}" data-act="pick" data-field="${field}" data-value="${esc(value)}">${esc(label)}</button>`;
}
/** One option. Single-select shows itself by inverting; multi adds a tick. */
function optionRow(o, on, attrs, multi) {
  return `<button class="row${on ? " on" : ""}" type="button" role="${multi ? "checkbox" : "radio"}" aria-checked="${on}" ${attrs}>
      ${disc(o.icon)}
      <span class="label">${esc(o.label)}${o.sub ? `<span class="sublabel">${esc(o.sub)}</span>` : ""}</span>
      ${multi ? `<span class="tick">${CHECK}</span>` : ""}
    </button>`;
}
function singleScreen(titleKey, subKey, list, field) {
  const chosen = state[field];
  return {
    html: `<h1 class="title">${esc(t(titleKey))}</h1>
      ${subKey ? `<p class="sub">${esc(t(subKey))}</p>` : ""}
      <div class="rows" role="radiogroup" aria-label="${esc(t(titleKey))}">
        ${list.map((o) => optionRow(o, chosen === o.key, `data-act="choose" data-field="${field}" data-value="${esc(o.key)}"`, false)).join("")}
      </div>`,
    dock: cta(t("common.continue"), !chosen),
  };
}
/** One answer as a chip. The glyph is a bubble on goals, bare ink elsewhere,
    and bare ink turns white when the chip is selected. */
function optionChip(o, on, attrs, bubble) {
  return `<button class="chip${on ? " on" : ""}" type="button" role="checkbox" aria-checked="${on}" ${attrs}>
      ${bubble ? disc(o.icon, 32) : icon(o.icon, 16)}
      <span class="label">${esc(o.label)}</span>
    </button>`;
}
/** A multi-answer grid of chips. */
function chipScreen(titleKey, list, set, ctaKey, noteKey) {
  const sel = state[set];
  return {
    html: `<h1 class="title">${esc(t(titleKey))}</h1>
      <div class="chips">
        ${list.map((o) => optionChip(o, !!sel[o.key], `data-act="multi" data-set="${set}" data-key="${esc(o.key)}"`, false)).join("")}
      </div>
      ${noteKey ? `<div class="allergy-warning">${WARN_TRIANGLE}<p>${esc(t(noteKey))}</p></div>` : ""}`,
    dock: cta(t(ctaKey)),
  };
}
/** One answer as a check row: box, bubble, label, and the note underneath. */
function checkRow(o, on, attrs) {
  return `<button class="check-row${on ? " on" : ""}" type="button" role="checkbox" aria-checked="${on}" ${attrs}>
      <span class="check-head">
        <span class="checkbox">${CHECK}</span>
        ${disc(o.icon, 32)}
        <span class="label">${esc(o.label)}</span>
      </span>
      ${o.sub ? `<span class="check-sub">${esc(o.sub)}</span>` : ""}
    </button>`;
}

/* ---- copy the web needs and the app does not ------------------------
   The app's last screen drops you into the scanner. On the web there is
   no scanner to drop into, so the last screen has to hand over to a
   store. These are the only strings written here rather than lifted
   from the app, and they are kept in T so every string still has one
   home. */
/* The app quotes the annual plan by the week. The web quotes it by the day,
   because a day is the unit the price stops sounding like a subscription in.
   The app still says per week, so the two paywalls differ on this line. */
/* Slashed like the term under it, so the two lines read as one price in two
   units rather than as two prices. The exact figure is a division that rounds
   to the nearest penny, and the term it divides is printed directly below,
   which is where anyone checking the arithmetic would look anyway. */
T["plan.perDayEquivalent"] = "{price}/day";
T["onboarding.done.iosSmall"] = "Download on the";
T["onboarding.done.iosStore"] = "App Store";
T["onboarding.done.androidSmall"] = "Get it on";
T["onboarding.done.androidStore"] = "Google Play";
/* The app is where the thing they paid for actually happens, and it only
   knows them by the account made a screen ago. Saying so here is the
   difference between a paid trial and a paid trial someone uses. */

const CALIB_ROWS = [

/* The rating, under the loader, the way Rise puts it under theirs. A wait is
   the one moment in the funnel with nothing to read and nothing to tap, and
   somebody else's sentence is the best thing to hand a person who is sitting
   still wondering whether this was worth starting.

   The quotes are whatever the reviews screen had no room for, so nobody is
   shown the same review twice. That is one review at the moment, so it sits;
   the rotation is kept because the ceiling above it is a number that moves. */
const CALIB_REVIEWS = REVIEWS.slice(WEB_REVIEWS);
function calibProof() {
  if (CALIB_REVIEWS.length === 0) return "";
  const r = CALIB_REVIEWS[Math.min(CALIB_REVIEWS.length - 1,
    Math.floor(ui.calibPct / (100 / CALIB_REVIEWS.length)))];

      <p class="calib-proof-count">${esc(t("onboarding.calib.proof", { users: REVIEW_USERS }))}</p>

      <p class="calib-name">${esc(r.name)}</p>
    </div>`;
}

/* ---- prices, read off the store rather than typed in ---------------
   A price in the markup is a price that goes stale in a currency we
   never tested. Everything below reads what RevenueCat returns and says
   so plainly when it has nothing to read. */
function pkgPrice(pkg) {
  if (!pkg) return null;
  const p = pkg.webBillingProduct || pkg.rcBillingProduct || pkg.product || {};
  const c = p.currentPrice || p.price || {};
  return c.formattedPrice || p.priceString || null;
}
/* The price cut into however many periods the card wants to quote. */
function pkgPerPeriod(pkg, periods) {
  if (!pkg) return null;
  const p = pkg.webBillingProduct || pkg.rcBillingProduct || pkg.product || {};
  const c = p.currentPrice || p.price || {};
  const micros = c.amountMicros;
  const currency = c.currency || c.currencyCode;
  if (typeof micros !== "number" || !currency) return null;
  try {
    /* Formatted in the language of the copy around it, not the browser's,
       for the same reason the trial date is: the store hands back "€49.99"
       and a Greek browser was rendering our slice of it as "0,14 €", two
       spellings of the same currency stacked one on top of the other. */
    return new Intl.NumberFormat(document.documentElement.lang || "en-US", {
      style: "currency", currency: currency,
    }).format(micros / 1e6 / periods);
  } catch (e) { return null; }
}
/* How many free days this package actually offers, which is not a constant.
   RevenueCat prices offerings per customer, so the trial phase comes back
   null for anyone the eligibility rules have already spent it on, and that
   is every returning customer. Promising a trial we cannot deliver is how
   a paywall charges someone who was told they would not be charged. */
function pkgTrialDays(pkg) {
  if (!pkg) return null;
  const p = pkg.webBillingProduct || pkg.rcBillingProduct || pkg.product || {};
  const opt = p.defaultSubscriptionOption || p.defaultPurchaseOption || {};
  const trial = p.freeTrialPhase || opt.trial || null;
  if (!trial) return null;
  const period = trial.period || trial.periodDuration || null;
  if (period && typeof period === "object" && typeof period.number === "number") {
    const n = period.number;
    const unit = String(period.unit || "").toLowerCase();
    if (unit.indexOf("day") === 0) return n;
    if (unit.indexOf("week") === 0) return n * 7;
    if (unit.indexOf("month") === 0) return n * 30;
    if (unit.indexOf("year") === 0) return n * 365;
    return null;
  }
  const iso = typeof period === "string" ? period : trial.periodDuration;
  if (typeof iso !== "string") return null;
  const m = iso.match(/^P(?:(\d+)Y)?(?:(\d+)M)?(?:(\d+)W)?(?:(\d+)D)?$/);
  if (!m) return null;
  const days = (+m[1] || 0) * 365 + (+m[2] || 0) * 30 + (+m[3] || 0) * 7 + (+m[4] || 0);
  return days > 0 ? days : null;
}

/* One hand, pointed up or down. Drawn rather than typed as an emoji: the
   emoji renders in the system's own skin tone and cartoon style on every
   platform, which is three different pictures of a hand and none of them
   ours. Stroked in currentColor so the navy state needs no second copy. */
function thumbMark(down) {
  return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"
    ${down ? 'style="transform:rotate(180deg)"' : ""}>
    <path d="M6.9 10.6v8.2H4.8a1 1 0 0 1-1-1v-6.2a1 1 0 0 1 1-1Z"
      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M6.9 10.6 11.6 3.6a2.1 2.1 0 0 1 1.9 2.2v3.1h4.4a1.7 1.7 0 0 1 1.7 2l-1.1 6.4a1.7 1.7 0 0 1-1.7 1.5H6.9Z"
      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}

/* Twelve screens built from one shape. They share a class so they share a
   look, and the tap that answers is the tap that moves on, exactly as the
   age screen works: a Continue button under a two-answer question is a
   second tap that decides nothing.

   The counter above the line is the only chrome on the screen, and it is
   there because the progress bar is hidden through the round: a reader
   going this fast wants to know how much faster there is left to go. */
SYMPTOMS.forEach((s, n) => {
  SCREENS["sym-" + s.key] = () => {
    const answer = state.symptoms[s.key];
    const hand = (value, down) => `<button class="thumb${answer === (value === "yes") ? " on" : ""}" type="button"
        role="radio" aria-checked="${answer === (value === "yes")}"
        data-act="yesno" data-key="${esc(s.key)}" data-value="${value}">
        <span class="thumb-disc">${thumbMark(down)}</span>
        <span class="thumb-label">${esc(t("common." + value))}</span>
      </button>`;
    return {
      cls: "sym",
      html: `<p class="sym-counter">${esc(t("onboarding.lightning.counter", { n: n + 1, total: SYMPTOMS.length }))}</p>
        <h1 class="title">${esc(t(s.labelKey))}</h1>
        <div class="thumbs" role="radiogroup" aria-label="${esc(t(s.labelKey))}">
          ${hand("yes", false)}${hand("no", true)}
        </div>`,
      dock: "",
    };
  };
});

Object.assign(SCREENS, {
  /* Age. Sex is already answered on the landing, so the one input left gets
     the whole screen: six boxes, one question, and the tap that answers it is

  [S.ABOUT]: () => ({

  [S.SHOPFOR]: () => singleScreen("onboarding.shopFor.title", null, SHOP_FOR, "shopFor"),
  [S.HABITS]: () => singleScreen("onboarding.habits.title", null, HABITS, "habit"),

  [S.GOALS]: () => {

  [S.ADDITIVES]: () => ({

    /* Set here rather than in the timer, because `after` runs inside render

    if (!countTimer) ui.countdown = COUNTDOWN_FROM;

  [S.CALIB]: () => ({

  /* The plan is picked before this screen, which is the one place the web

     charged, because Web Billing attaches the purchase to a Supabase user id,
     so this screen is the last gate rather than the first. */
  [S.ACCOUNT]: () => {
    const signin = state.authMode === "signin";
    const stage = state.authStage;

    /* The card is taken before the account exists, so somebody landing here
       with the trial already running is not saving their progress, they are
       collecting something they have paid for. Worth saying, because this is
       the one screen standing between a charge and the thing charged for. */
    const paid = !!state.purchased && !currentUser;
    const trialed = state.purchasedTrial !== false;
    const headTitle = signin
      ? "onboarding.auth.signinTitle"
      : paid ? (trialed ? "onboarding.auth.paidTitle" : "onboarding.auth.paidTitleNoTrial")
      : "onboarding.auth.createTitle";

      : paid ? (trialed ? "onboarding.auth.paidSub" : "onboarding.auth.paidSubNoTrial")

    const otpBoxes = (label) => {
      const digits = ui.otp.split("");
      return `<div class="otp">

            aria-label="${esc(label)}" value="${esc(ui.otp)}">
        </div>`;
    };
    const resendBlock = () => `<p class="resend">
        <button type="button" data-act="resend"${ui.cooldown > 0 ? " disabled" : ""}>${esc(
          ui.cooldown > 0
            ? t("onboarding.otp.resendIn", { seconds: ui.cooldown })
            : t("onboarding.otp.resend"),
        )}</button>
      </p>`;
    const focusOtp = () => {
      const el = document.getElementById("otp-input");
      if (el) { el.focus(); el.setSelectionRange(ui.otp.length, ui.otp.length); }
    };

    /* The code that resets a password, with the new one asked for on the
       same screen so nobody has to hold a code in their head twice. */
    if (stage === "resetcode") {
      return {
        cls: "email sent resetting",
        html: `<h1 class="title">${esc(t("onboarding.reset.codeTitle"))}</h1>
          <p class="sub">${esc(t("onboarding.reset.codeSub", { email: state.email }))}</p>

        dock: cta(t("onboarding.reset.cta"), ui.busy || ui.otp.length < 6 || ui.newPw.length < 8, "resetverify")

        after: focusOtp,
      };
    }

    /* Asking for the email a reset code should go to. No password: there
       is no point checking one nobody can remember. */
    if (stage === "reset") {
      return {
        cls: "email resetting",
        html: `<h1 class="title">${esc(t("onboarding.reset.title"))}</h1>
          <p class="sub">${esc(t("onboarding.reset.sub"))}</p>
          ${msgHtml()}
          <form id="resetform" novalidate>
            <div class="fields">
              <div>
                <p class="field-label">${esc(t("onboarding.auth.emailLabel"))}</p>
                <input class="input" type="email" name="email" value="${esc(state.email)}"
                  placeholder="${esc(t("onboarding.auth.emailPlaceholder"))}"
                  autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"
                  enterkeyhint="go" required data-bind="email"
                  aria-label="${esc(t("onboarding.auth.emailLabel"))}">
              </div>
            </div>
            <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
          </form>`,
        dock: cta(t("onboarding.reset.send"), ui.busy, "resetsend")
          + link(t("onboarding.reset.backToSignIn"), "backtosignin"),
      };
    }

    /* The code is out. The disc says so before the sentence does. */
    if (stage === "otp") {
      return {
        cls: "email sent",
        html: `<div class="mail-mark">${ICON_MAIL_SENT}</div>

    /* Email and password, reached only by choosing email on the way in. */
    if (stage === "form") {
      return {
        cls: "email",
        html: `<h1 class="title">${esc(t(headTitle))}</h1>
          <p class="sub">${esc(t(signin ? "onboarding.auth.emailSigninSub" : paid ? "onboarding.auth.paidSub" : "onboarding.auth.emailCreateSub"))}</p>
          ${msgHtml()}
          <form id="authform" novalidate>
            <div class="fields">

                  autocomplete="${signin ? "current-password" : "new-password"}" minlength="8"
                  enterkeyhint="go" required data-bind="password"
                  aria-label="${esc(t("onboarding.auth.passwordLabel"))}">
              </div>
            </div>
            ${signin ? `<button class="forgot" type="button" data-act="forgot">${esc(t("onboarding.auth.forgot"))}</button>` : ""}
            <button type="submit" hidden aria-hidden="true" tabindex="-1"></button>
          </form>`,
        dock: cta(t(signin ? "onboarding.auth.signIn" : "onboarding.auth.createAccount"), ui.busy, "auth")
          + link(t("onboarding.auth.differentMethod"), "methodback"),
      };
    }

    /* The way in. Two buttons, one shape, no field asked for yet. */
    return {
      html: `<h1 class="title">${esc(t(headTitle))}</h1>
        <p class="sub">${esc(t(headSub))}</p>
        <div class="divider"><i></i><span>${esc(t(signin ? "onboarding.auth.dividerSignIn" : "onboarding.auth.dividerSignUp"))}</span><i></i></div>
        ${msgHtml()}
        <div class="auth-stack">
          <button class="auth-btn" type="button" data-act="google">${ICON_GOOGLE}${esc(t("onboarding.auth.google"))}</button>
          <button class="auth-btn" type="button" data-act="emailmethod">${ICON_MAIL}${esc(t("onboarding.auth.email"))}</button>
        </div>`,
      dock: link(t(signin ? "onboarding.auth.noAccount" : "onboarding.auth.alreadyHave"), "swapmode"),
    };
  },

  /* The plan. Every figure on it is the store's own, and the legal line
     is built from the same price rather than a second copy of it. */
  [S.PLAN]: () => {
    const annual = ui.packages && ui.packages.annual;
    const monthly = ui.packages && ui.packages.monthly;
    const chosen = state.plan === "annual" ? annual : monthly;
    const chosenPrice = pkgPrice(chosen);
    const unavailable = t("plan.priceUnavailable");
    /* The trial the store is actually offering this customer, which is null
       for anyone who has already spent one, here or in the App Store. Until
       the offering loads we show the trial we intend to give, so the screen
       does not flicker from one paywall into the other. */
    const trialDays = ui.packages ? pkgTrialDays(chosen) : TRIAL_DAYS;

    const dot = (bg, glyph) => `<span class="dot" style="background:${bg}">${glyph}</span>`;
    const tick = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const clock = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#A86A14" stroke-width="1.6"/><path d="M8 4.5V8l2.4 1.4" stroke="#A86A14" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const cal = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" stroke="#9AA0AB" stroke-width="1.6"/></svg>';

    /* The calendar day the trial turns into a charge, written out rather than
       left as "day 7" for the reader to count to. Undated when the browser has
       no formatting for the language, which is better than a half-formatted
       date. */
    let billingDate = null;
    try {
      /* Dated in the language the sentence around it is written in, not the
         browser's. A Greek browser reading English copy was being told the
         trial ends "18 Sep" in Greek, half a sentence in each language. */
      billingDate = new Date(Date.now() + trialDays * 86400000)
        .toLocaleDateString(document.documentElement.lang || "en-US",
          { month: "short", day: "numeric" });
    } catch (e) { billingDate = null; }

    const rows = [
      [dot("#F58A3C", tick), t("onboarding.plan.today"), t("onboarding.plan.todayDesc"), "#F0C39A"],
    ];
    if (trialDays >= 2) {
      rows.push([dot("#FCEFD6", clock), t("onboarding.plan.reminder", { day: trialDays - 1 }), t("onboarding.plan.reminderDesc"), "#E7DFCF"]);
    }
    rows.push([
      dot("#E7DFCF", cal),
      billingDate
        ? t("onboarding.plan.endsDated", { days: trialDays, date: billingDate })
        : t("onboarding.plan.ends", { days: trialDays }),
      t("onboarding.plan.endsDesc"),
      null,
    ]);

    /* The day rate leads and the term follows. Nobody decides between fifty
       pounds and ten; they decide whether a thing is worth the coin it costs
       today, and the yearly card only ever wins on that comparison. The term
       stays underneath rather than going away, because a per-day figure with
       no billing period attached is the shape of a trick. */
    const planCard = (key, pkg, labelKey, per, days, tag) => {
      const price = pkgPrice(pkg);
      const daily = pkgPerPeriod(pkg, days);
      const term = price ? price + t(per) : unavailable;
      return `<button class="plan${state.plan === key ? " on" : ""}" type="button" role="radio"
          aria-checked="${state.plan === key}" data-act="plan" data-value="${key}">
        <span class="top">
          <span class="radio"></span>
          <span class="col">
            <span class="pname">${esc(t(labelKey))}</span>
            <span class="psub">${esc(daily ? t("plan.perDayEquivalent", { price: daily }) : term)}</span>
            ${daily ? `<span class="pweek">${esc(term)}</span>` : ""}
          </span>
        </span>
        ${tag ? `<span class="tagline">${esc(t(tag))}</span>` : ""}
      </button>`;
    };

    const legal = trialDays && chosenPrice
      ? t(trialDays === 1 ? "paywall.legal.trial_one" : "paywall.legal.trial_other", { count: trialDays, price: chosenPrice })
      : t("paywall.legal");

    /* With a trial, the screen is a promise about what happens over the next
       few days. Without one, it is a plain offer, so the timeline, the two
       reassurances and the free-trial wording all come off rather than lie. */
    const body = trialDays
      ? `<div class="timeline">
          ${rows.map(([mark, head, desc, line]) => `<div class="tl">
            <span class="rail">${mark}${line ? `<span class="line" style="background:${line}"></span>` : ""}</span>
            <span class="txt"><b>${esc(head)}</b><span>${esc(desc)}</span></span>
          </div>`).join("")}
        </div>`
      : `<p class="plan-sub">${esc(t("paywall.subtitle"))}</p>
        <div class="values">
          ${["scans", "alternatives", "alerts", "receipts"].map((k) =>
            `<div><i>${tick}</i><span>${esc(t("paywall.value." + k))}</span></div>`).join("")}
        </div>`;

    return {
      html: `<h1 class="title">${esc(t(trialDays ? "onboarding.plan.title" : "paywall.title.neutral"))}</h1>
        ${msgHtml()}
        ${body}
        <div class="plans" role="radiogroup" aria-label="${esc(t("onboarding.plan.title"))}">
          ${planCard("annual", annual, "onboarding.plan.annual", "plan.perYear", 365, "onboarding.plan.bestValue")}
          ${planCard("monthly", monthly, "onboarding.plan.monthly", "plan.perMonth", 365 / 12, null)}
        </div>
        ${trialDays ? reassure(t("onboarding.plan.noChargeToday"), "under") : ""}`,
      /* The cancellation promise is pinned to the button rather than left at
         the end of the scroll, because it is the answer to the question the
         button asks. The legal line closes underneath it.

         The button asks for the trial, not for a payment method. Which methods
         there are is the next question, and it is asked in a sheet of ours so
         the wallet can be offered first. A reader whose browser holds no card
         never sees the sheet at all. */
      dock: (trialDays ? reassure(t("onboarding.plan.cancelAnytime"), "docked") : "")
        + cta(t(trialDays ? "onboarding.trial.cta" : "paywall.subscribe"), ui.busy || !chosen, "pay")
        + `<p class="legal">${esc(legal)}</p>`,
      after: () => { loadOfferings(); mountExpressButton(); },
    };
  },

  /* Done. The app would open the scanner here; the web hands over to a
     store, and lets the browser pick which one is worth showing first. */
  [S.DONE]: () => ({
    html: `<div class="done-wrap">
        <div class="mark">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7.5" stroke="#2E7D52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="title">${esc(t("onboarding.done.title"))}</h1>
        <p class="sub">${esc(t(state.purchasedTrial === false ? "onboarding.done.subNoTrial" : "onboarding.done.sub"))}</p>
        ${currentUser && currentUser.email ? `<div class="done-acct">
          <span class="done-acct-label">${esc(t("onboarding.done.signInWith"))}</span>
          <span class="done-acct-email">${esc(currentUser.email)}</span>
        </div>` : ""}
        <div class="done-stores">
          <a class="cta store" href="${IOS_URL}">
            <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
            <span class="txt"><small>${esc(t("onboarding.done.iosSmall"))}</small><strong>${esc(t("onboarding.done.iosStore"))}</strong></span>
          </a>
          <a class="cta store outline" href="${PLAY_URL}">
            <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 65.5 65.7 65.5 60.1-34.1c18-14.3 18-46.5-1.2-62.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
            <span class="txt"><small>${esc(t("onboarding.done.androidSmall"))}</small><strong>${esc(t("onboarding.done.androidStore"))}</strong></span>
          </a>
        </div>
      </div>`,
  }),
});

/* ---- the machinery that drives them -------------------------------- */

/** The bar counts the ten question screens, and only the ones behind
    you. It is a count of work done, not of pixels travelled. */
function paintBar(f, idx) {
  const done = PROGRESS_STEPS.filter((id) => {
    const j = f.indexOf(id);
    return j !== -1 && j <= idx;
  }).length;
  barEl.setAttribute("aria-valuenow", String(done));
  barEl.innerHTML = PROGRESS_STEPS.map((_, i) => `<span${i < done ? ' class="on"' : ""}></span>`).join("");
}

/* Which screen is on display, as the flow identifies it. The account screen is
   four screens in the app and moves between them the same way, so its stage is
   part of the identity. Re-rendering the screen already showing, which happens
   on every keystroke and every tap of an option, is not a move and is not
   animated. */
let showing = null;
let slideTimer = 0;

/* The screen being left is kept as it stands rather than rendered again, and
   goes out under the one arriving. The hero is the one screen never held: it
   owns a video player, and a second copy of it alive for even a third of a
   second is a second player. */
function slide(fromId, dir) {
  const out = layerEl.cloneNode(true);
  out.removeAttribute("id");
  out.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
  out.classList.add("layer-out");
  out.inert = true;
  if (fromId !== S.HERO) {
    out.style.setProperty("--dx", -dir * 100 + "%");
    out.classList.add("slide-out");
    stageEl.appendChild(out);
    clearTimeout(slideTimer);
    slideTimer = setTimeout(() => out.remove(), MOTION.slide);
  }
  layerEl.style.setProperty("--dx", dir * 100 + "%");
  layerEl.classList.remove("slide-in");
  void layerEl.offsetWidth;
  layerEl.classList.add("slide-in");
}

function render() {
  const f = flow();
  const idx = Math.max(0, Math.min(state.i, f.length - 1));
  state.i = idx;
  const id = f[idx];
  const screen = SCREENS[id]();
  const bare = CHROMELESS.indexOf(id) !== -1;

  const key = id === S.ACCOUNT ? id + ":" + state.authStage : String(id);
  if (showing && showing.key !== key) {
    /* Which way the move went is a question about the order of the flow, not
       about the numbers the screens happen to be identified by. A screen off
       the flow, such as the account form, has no position, so the move it is
       part of is treated as forward. */
    const from = f.indexOf(showing.id);
    const to = f.indexOf(id);
    slide(showing.id, from < 0 || to < 0 || to >= from ? 1 : -1);
  }
  showing = { key, id };

  /* A screen may name its own class: the account screen is four screens
     in the app, and each wants the app's own title size and padding. */
  stepEl.className = "step step--" + (screen.cls || id) + (bare ? " chromeless" : "");
  stepEl.innerHTML = screen.html;
  dockBodyEl.innerHTML = screen.dock || "";
  dockEl.hidden = !screen.dock;
  /* The sheet belongs to the plan screen and nowhere else. Its words are kept
     current while it is closed so it opens already right, and leaving the plan
     screen shuts it rather than leaving it hanging over whatever came next. */
  if (id === S.PLAN) paintSheet(); else closePay();
  chromeEl.hidden = bare;
  backEl.dataset.hidden = idx === 0 ? "1" : "0";
  paintBar(f, idx);
  window.scrollTo(0, 0);
  save();
  /* Every arrival goes through here, whether it came from the next button,
     the back button or a resumed draft, so this is the one place a screen
     cannot be reached without being counted. */
  reportCheckpoint(id);
  reportStep(id, idx);
  if (screen.after) screen.after();
}

function go(n) {
  const f = flow();
  state.i = Math.max(0, Math.min(state.i + n, f.length - 1));
  setMsg(null);
  render();
}

/** Back steps through the account screen's own stages first, so the
    button never throws away a code someone is halfway through. */
const AUTH_BACK = { resetcode: "reset", reset: "form", otp: "form", form: "methods" };
function goBack() {
  if (flow()[state.i] === S.ACCOUNT && AUTH_BACK[state.authStage]) {
    state.authStage = AUTH_BACK[state.authStage];
    ui.otp = "";
    ui.newPw = "";
    setMsg(null);
    render();
    return;
  }
  const f = flow();
  let n = 1;
  while (state.i - n > 0 && AUTO_ADVANCE.indexOf(f[state.i - n]) !== -1) n += 1;
  go(-n);
}

/* Rise counts five. Five whole seconds of a reader watching a number is five
   seconds they could spend leaving, so the count is Rise's and the clock is
   ours: the same five beats, run fast enough to read as urgency rather than
   as a wait. */
const COUNTDOWN_FROM = 5;
const COUNTDOWN_TICK = 620;
let countTimer = null;
function runCountdown() {
  if (countTimer) return;
  countTimer = setInterval(() => {
    if (flow()[state.i] !== S.LIGHTNING) {
      clearInterval(countTimer);
      countTimer = null;
      return;
    }
    ui.countdown -= 1;
    if (ui.countdown <= 0) {
      clearInterval(countTimer);
      countTimer = null;
      go(1);
      return;
    }
    render();
  }, COUNTDOWN_TICK);
}

let calibTimer = null;
function runCalibration() {
  if (calibTimer) return;
  ui.calibPct = 0;
  /* A point a tick rather than two, and a slower tick: the bar is the only thing
     holding the reviews on screen, and at two seconds a review is a thing that
     flashed past rather than a thing that was read. Roughly two and a half
     seconds each, which is a short quote read once. */
  calibTimer = setTimeout(() => {
    calibTimer = setInterval(() => {
      ui.calibPct = Math.min(100, ui.calibPct + 1);
      if (ui.calibPct >= 100) {
        clearInterval(calibTimer);
        calibTimer = null;
        setTimeout(() => { if (flow()[state.i] === S.CALIB) go(1); }, 420);
      }
      if (flow()[state.i] === S.CALIB) render();
    }, 48);
  }, 400);
}

let cooldownTimer = null;
function startCooldown() {
  ui.cooldown = 30;
  clearInterval(cooldownTimer);
  cooldownTimer = setInterval(() => {
    ui.cooldown -= 1;
    if (ui.cooldown <= 0) { clearInterval(cooldownTimer); cooldownTimer = null; }
    if (flow()[state.i] === S.ACCOUNT
      && (state.authStage === "otp" || state.authStage === "resetcode")) render();
  }, 1000);
}

/* ---- one listener each, dispatched on data-act ---------------------- */

let advancing = false;
const ACTIONS = {
  next: () => go(1),
  back: () => goBack(),
  /* Set a field and stay put: the screen has more than one question. */
  pick: (el) => {
    state[el.dataset.field] = el.dataset.value;
    render();
  },
  /* Set a field and move on, after long enough to see it was taken. */
  choose: (el) => {
    if (advancing) return;
    state[el.dataset.field] = el.dataset.value;
    advancing = true;
    render();
    setTimeout(() => { advancing = false; go(1); }, 240);
  },
  /* Yes or no, then move on. Stored as a boolean rather than by presence in
     a set, so a No is recorded as an answer given instead of as a question
     skipped. The two are not the same thing to read back. */
  yesno: (el) => {
    if (advancing) return;
    state.symptoms[el.dataset.key] = el.dataset.value === "yes";
    advancing = true;
    render();
    setTimeout(() => { advancing = false; go(1); }, 240);
  },
  multi: (el) => {
    const set = state[el.dataset.set];
    const key = el.dataset.key;
    const on = !set[key];
    if (key === "All of the above") {
      ADDITIVES.forEach((o) => { set[o.key] = on; });
    } else if (key === "None") {
      Object.keys(set).forEach((k) => { delete set[k]; });
      if (on) set.None = true;
    } else {
      set[key] = on;
      if (!on) delete set[key];
      delete set.None;
      delete set["All of the above"];
    }
    render();
  },
  flagtoggle: () => { state.flagUltraProcessed = !state.flagUltraProcessed; render(); },
  /* Switching plans tells the wallet button what it is buying now. It is told
     rather than rebuilt: Stripe draws it in an iframe, and an iframe written
     over is an iframe that reloads, so the reader would watch Apple Pay blink
     out and come back every time they touched a price. */
  plan: (el) => {
    state.plan = el.dataset.value;
    if (ui.express) { try { ui.express.updatePurchase(selectedPackage()); } catch (e) {} }
    render();
  },
  pay: () => openPay(),
  closepay: () => closePay(),
  signin: () => {
    state.authMode = "signin";
    state.authStage = "methods";
    state.i = flow().indexOf(S.ACCOUNT);
    setMsg(null);
    render();
  },
  swapmode: () => {
    state.authMode = state.authMode === "signin" ? "signup" : "signin";
    setMsg(null);
    render();
  },
  emailmethod: () => { state.authStage = "form"; setMsg(null); render(); },
  methodback: () => { state.authStage = "methods"; state.password = ""; setMsg(null); render(); },
  forgot: () => { state.authStage = "reset"; ui.otp = ""; ui.newPw = ""; setMsg(null); render(); },
  backtosignin: () => {
    state.authMode = "signin";
    state.authStage = "form";
    ui.otp = "";
    ui.newPw = "";
    setMsg(null);
    render();
  },
  otpback: () => { state.authStage = "form"; ui.otp = ""; setMsg(null); render(); },
  auth: () => startEmail(),
  verify: () => verifyCode(),
  resetsend: () => startReset(),
  resetverify: () => finishReset(),
  resend: () => {
    if (ui.cooldown > 0) return;
    if (state.authStage === "resetcode") startReset(true); else startEmail(true);
  },
  google: () => startGoogle(),
  buy: () => { closePay(); startCheckout(); },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (el) {
    ev.preventDefault();
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el);
    return;
  }
  if (ev.target.closest("#back")) { ev.preventDefault(); goBack(); }
});

/* Typing is bound straight to state, so a re-render never loses a
   half-typed field. The OTP boxes repaint as you go. */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "otp-input") {
    ui.otp = el.value.replace(/\D/g, "").slice(0, 6);
    const boxes = stepEl.querySelectorAll(".otp b");
    boxes.forEach((b, k) => {
      b.textContent = ui.otp[k] || "";
      b.classList.toggle("filled", !!ui.otp[k]);
    });
    el.value = ui.otp;
    /* A sign-in code has nothing left to ask for, so it submits itself. A
       reset code does: the new password is still blank below it. */
    if (state.authStage === "resetcode") {
      const button = dockEl.querySelector('[data-act="resetverify"]');
      if (button) button.disabled = ui.busy || ui.otp.length < 6 || ui.newPw.length < 8;
      return;
    }
    const button = dockEl.querySelector('[data-act="verify"]');
    if (button) button.disabled = ui.busy || ui.otp.length < 6;
    if (ui.otp.length === 6) verifyCode();
    return;
  }
  if (el.dataset && el.dataset.bindui) {
    ui[el.dataset.bindui] = el.value;
    const button = dockEl.querySelector('[data-act="resetverify"]');
    if (button) button.disabled = ui.busy || ui.otp.length < 6 || ui.newPw.length < 8;
    return;
  }
  if (el.dataset && el.dataset.bind) {
    state[el.dataset.bind] = el.value;
    const button = dockEl.querySelector(".cta:not(.outline)");
    if (button && flow()[state.i] === S.ACCOUNT) button.disabled = ui.busy;
  }
});

/* A real form means a real Go key on a phone keyboard. */
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "authform") startEmail();
  if (ev.target.id === "resetform") startReset();
});

/* ---------------------------------------------------------------- auth */

let currentUser = null;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function fnHeaders() {
  return {
    "Content-Type": "application/json",
    "apikey": ANON_KEY,
    "Authorization": "Bearer " + ANON_KEY,
    "x-device-id": deviceId(),
  };
}

/* The shape src/services/preferences.ts expects, so the phone reads back
   exactly what was answered here. */
function preferencesPayload() {
  return {
    goals: state.goals,
    habit: state.habit,
    upfFrequency: state.upfFrequency,
    additives: state.additives,
    diet: state.diet,
    allergies: state.allergies,
    flagUltraProcessed: state.flagUltraProcessed,
    countryCode: state.countryCode,
    language: state.language,
    onboardingComplete: true,
    onboarding: {
      ageBand: state.ageBand || "",
      sex: state.sex || "",
      shopFor: state.shopFor || "",
      symptoms: state.symptoms,
    },
  };
}

async function savePreferences(userId) {
  const write = () =>
    db.from("profiles").update({ preferences: preferencesPayload() }).eq("id", userId);
  let { error } = await write();
  if (error) {
    /* The profile row is created by a trigger, so one retry covers the race. */
    await new Promise((r) => setTimeout(r, 1500));
    ({ error } = await write());
  }
  return !error;
}

/* `resume` is true only when the reader just finished signing in by hand. The
   plan is chosen before the account exists, so that is the moment to pick the
   interrupted purchase back up. Boot passes false: a payment sheet opening by
   itself on page load would be an ambush. */
async function afterAuth(user, resume) {
  currentUser = user;
  await bindBillingToUser(user);
  await savePreferences(user.id);
  state.prefsSaved = true;
  state.password = "";
  state.authStage = "methods";
  ui.busy = false;
  ui.otp = "";
  ui.newPw = "";
  setMsg(null);
  /* Already paid, so the account was the last thing owed and they are done.
     Otherwise back to the paywall, so cancelling the sheet leaves them looking
     at the plans rather than at the account screen they have just finished. */
  state.i = flow().indexOf(state.purchased ? S.DONE : S.PLAN);
  save();
  render();
  if (resume && !state.purchased) startCheckout();
}

async function startEmail(isResend) {
  if (ui.busy) return;
  const email = (state.email || "").trim();
  if (!EMAIL_RE.test(email)) { setMsg(t("onboarding.error.invalidEmail")); render(); return; }
  if ((state.password || "").length < 8) { setMsg(t("onboarding.error.shortPassword")); render(); return; }
  ui.busy = true;
  setMsg(null);
  render();
  try {
    const res = await fetch(OTP_START, {
      method: "POST",
      headers: fnHeaders(),
      body: JSON.stringify({
        email,
        password: state.password,
        purpose: state.authMode === "signin" ? "login" : "signup",
      }),
    });
    const data = await res.json().catch(() => ({}));
    ui.busy = false;
    if (data && data.existing_account) {
      state.authMode = "signin";
      setMsg(t("onboarding.error.existingAccount"));
      render();
      return;
    }
    if (res.status === 401) { setMsg(t("onboarding.error.authFailed")); render(); return; }
    if (!res.ok) { setMsg(t("onboarding.error.generic")); render(); return; }
    state.authStage = "otp";
    ui.otp = "";
    if (!isResend) setMsg(null);
    startCooldown();
    render();
  } catch (e) {
    ui.busy = false;
    setMsg(t("onboarding.error.generic"));
    render();
  }
}

async function verifyCode() {
  if (ui.busy) return;
  if (ui.otp.length < 6) { setMsg(t("onboarding.error.enterCode")); render(); return; }
  ui.busy = true;
  setMsg(null);
  render();
  try {
    const res = await fetch(OTP_VERIFY, {
      method: "POST",
      headers: fnHeaders(),
      body: JSON.stringify({
        email: (state.email || "").trim(),
        code: ui.otp,
        purpose: state.authMode === "signin" ? "login" : "signup",
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token) {
      ui.busy = false;
      ui.otp = "";
      setMsg(t("onboarding.error.badCode"));
      render();
      return;
    }
    const { data: sess, error } = await db.auth.setSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
    });
    if (error || !sess.user) throw error || new Error("no user");
    await afterAuth(sess.user, true);
  } catch (e) {
    ui.busy = false;
    setMsg(t("onboarding.error.generic"));
    render();
  }
}

/* The reset purpose, which the server answers the same way for an address
   it holds and one it does not, so this screen cannot be used to ask
   whether somebody has an account. */
async function startReset(isResend) {
  if (ui.busy) return;
  const email = (state.email || "").trim();
  if (!EMAIL_RE.test(email)) { setMsg(t("onboarding.error.invalidEmail")); render(); return; }
  ui.busy = true;
  setMsg(null);
  render();
  try {
    const res = await fetch(OTP_START, {
      method: "POST",
      headers: fnHeaders(),
      body: JSON.stringify({ email, purpose: "reset" }),
    });
    ui.busy = false;
    if (!res.ok) { setMsg(t("onboarding.error.generic")); render(); return; }
    state.authStage = "resetcode";
    if (!isResend) { ui.otp = ""; ui.newPw = ""; }
    startCooldown();
    render();
  } catch (e) {
    ui.busy = false;
    setMsg(t("onboarding.error.generic"));
    render();
  }
}

async function finishReset() {
  if (ui.busy) return;
  if (ui.otp.length < 6) { setMsg(t("onboarding.error.enterCode")); render(); return; }
  if (ui.newPw.length < 8) { setMsg(t("onboarding.error.shortPassword")); render(); return; }
  ui.busy = true;
  setMsg(null);
  render();
  try {
    const res = await fetch(OTP_VERIFY, {
      method: "POST",
      headers: fnHeaders(),
      body: JSON.stringify({
        email: (state.email || "").trim(),
        code: ui.otp,
        purpose: "reset",
        new_password: ui.newPw,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token) {
      ui.busy = false;
      ui.otp = "";
      setMsg(t("onboarding.error.badCode"));
      render();
      return;
    }
    const { data: sess, error } = await db.auth.setSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
    });
    if (error || !sess.user) throw error || new Error("no user");
    ui.newPw = "";
    await afterAuth(sess.user, true);
  } catch (e) {
    ui.busy = false;
    setMsg(t("onboarding.error.generic"));
    render();
  }
}

async function startGoogle() {
  save();
  try {
    await db.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname },
    });
  } catch (e) {
    setMsg(t("onboarding.error.generic"));
    render();
  }
}

/* ------------------------------------------------------------- billing */

/* The prices are shown before there is an account to attach them to, so the
   SDK is started against an anonymous id and moved onto the real one once the
   reader signs in. The anonymous id is kept rather than regenerated, so a
   reload mid-funnel is the same shopper to RevenueCat and not a new one. */
function anonBillingId(Purchases) {
  let id = null;
  try { id = localStorage.getItem(RC_ANON_KEY); } catch (e) { /* private mode */ }
  if (!id) {
    id = Purchases.generateRevenueCatAnonymousAppUserId();
    try { localStorage.setItem(RC_ANON_KEY, id); } catch (e) { /* ignore */ }
  }
  return id;
}

let purchasesPromise = null;
async function getPurchases() {
  if (!purchasesPromise) {
    purchasesPromise = (async () => {
      /* Pinned. The alias that carries a pre-account purchase onto the new
         account rides on `identifyUser`, which the SDK still marks
         experimental, so an unpinned CDN import could change the checkout
         under a live page with no deploy to point at. */
      const { Purchases } = await import("https://esm.sh/@revenuecat/purchases-js@1.62.0");
      const id = currentUser ? currentUser.id : anonBillingId(Purchases);
      try { return Purchases.configure(RCB_PUBLIC_KEY, id); }
      catch (e) { return Purchases.getSharedInstance(); }
    })();
  }
  return purchasesPromise;
}

/* Moving the shopper onto the account they just made. This has to be
   `identifyUser` and not `changeUser`: `changeUser` only replaces the id the
   SDK holds in memory, so a card charged before signing up would stay on the
   anonymous customer and the new account would own nothing. `identifyUser`
   asks RevenueCat to alias the two, which is what carries the purchase across,
   and it aliases only while the old id is anonymous, so signing in over a real
   id stays a plain switch. */
async function bindBillingToUser(user) {
  if (!purchasesPromise) return;
  const purchases = await purchasesPromise.catch(() => null);
  if (!purchases) return;
  try {
    if (purchases.isAnonymous && purchases.isAnonymous()) {
      try {
        await purchases.identifyUser(user.id);
      } catch (e) {
        /* One retry, because this is the single step deciding whether a trial
           already paid for reaches the account that was just made. */
        await new Promise((r) => setTimeout(r, 1200));
        await purchases.identifyUser(user.id);
      }
    }
    /* Put the address on the customer now that there is one: checkout may
       have collected a different one, or none at all. */
    if (user.email) {
      try { await purchases.setAttributes({ $email: user.email }); } catch (e) {}
    }
  } catch (e) {
    /* Last resort, so the rest of the page is at least talking about the right
       customer. A purchase made before signing up is left on the anonymous one
       and has to be merged by hand. */
    try { await purchases.changeUser(user.id); } catch (e2) {}
  }
}

/* Held as a promise rather than a flag so a checkout that starts while the
   prices are still in the air can wait for them instead of failing. Cleared on
   failure, so the next look at the plan screen tries again. */
let offeringsPromise = null;
function loadOfferings() {
  if (ui.packages) return Promise.resolve();
  if (!offeringsPromise) {
    offeringsPromise = (async () => {
      const purchases = await getPurchases();
      if (!purchases) return;
      const offerings = await purchases.getOfferings();
      const list = (offerings.current && offerings.current.availablePackages) || [];
      const byId = (id) => list.find((p) => p.identifier === id) || null;
      ui.packages = { annual: byId("$rc_annual"), monthly: byId("$rc_monthly") || byId("$rc_weekly") };
      /* The app sells monthly. If this offering still carries the old weekly
         package, say weekly rather than mislabel what is being charged. */
      if (!byId("$rc_monthly") && byId("$rc_weekly")) {
        T["onboarding.plan.monthly"] = t("onboarding.plan.weekly");
        T["plan.perMonth"] = t("plan.perWeek");
      }
      if (flow()[state.i] === S.PLAN) render();
    })().catch(() => { offeringsPromise = null; });
  }
  return offeringsPromise;
}

/* The click id has to be on the RevenueCat customer BEFORE the charge,
   because the webhook that reports the sale to Meta reads it back off the
   customer rather than off the browser. The web SDK does not retry a failed
   attribute write, so the failure is swallowed on purpose: a sale that
   reports without its ad is a worse number, a sale refused because the
   reporting failed is a worse outcome. */
async function setAttribution(purchases) {
  try {
    const attrs = {
      fb_click_id: fbClickId(),
      fb_browser_id: fbBrowserId(),
      client_ip: clientIp,
      client_user_agent: navigator.userAgent,
    };
    if (currentUser && currentUser.email) attrs["$email"] = currentUser.email;
    await purchases.setAttributes(attrs);
  } catch (e) { /* attribution is best effort, the sale is not */ }
}

/* Where both ways of paying end up. Paying is no longer the last thing owed:
   a shopper who came through the card without an account still has to make
   one to use the trial. */
function afterPurchase(pkg) {
  closePay();
  state.purchased = true;
  /* Whether it was a trial or a charge, remembered here because the screens
     after this one talk about it and the offering is gone by then. */
  state.purchasedTrial = pkgTrialDays(pkg) != null;
  ui.busy = false;
  state.i = flow().indexOf(currentUser ? S.DONE : S.ACCOUNT);
  save();
  render();
}

function selectedPackage() {
  return ui.packages && (state.plan === "annual" ? ui.packages.annual : ui.packages.monthly);
}

/* The sheet's words. They are written one element at a time rather than as
   markup, because the wallet button is a sibling of them inside the same card
   and rebuilding the card would reload its iframe. */
function paintSheet() {
  const pkg = selectedPackage();
  const price = pkgPrice(pkg);
  const days = pkgTrialDays(pkg);
  const annual = state.plan === "annual";
  payTitleEl.textContent = t("plan.payTitle");
  /* What is being bought, said once. The promise about the trial belongs to
     the small print underneath and is not worth saying twice. */
  payPriceEl.textContent = price
    ? t("plan.payFor", {
        plan: t(annual ? "onboarding.plan.annual" : "onboarding.plan.monthly"),
        price: price + t(annual ? "plan.perYear" : "plan.perMonth"),
      })
    : t("plan.priceUnavailable");
  payOrEl.textContent = t("plan.payOr");
  payCardEl.textContent = t("plan.payCard");
  payCardEl.disabled = ui.busy || !pkg;
  payLegalEl.textContent = days && price
    ? t(days === 1 ? "paywall.legal.trial_one" : "paywall.legal.trial_other", { count: days, price: price })
    : t("paywall.legal");
}

/* Nobody is made to open a sheet to find out there was only ever one way to
   pay. With no wallet to offer, the button goes where it always went.

   The answer takes a second or two to come back, and a reader who taps inside
   that second is not a reader without a wallet: they are a reader who was
   quick. Waiting briefly before deciding is the difference between offering
   Apple Pay and never mentioning it. */
async function openPay() {
  if (ui.busy) return;
  if (!ui.wallets) {
    ui.busy = true;
    render();
    await Promise.race([walletAnswered, new Promise((r) => setTimeout(r, WALLET_WAIT_MS))]);
    ui.busy = false;
    render();
  }
  if (!ui.wallets) { startCheckout(); return; }
  paintSheet();
  sheetEl.classList.remove("off");
}

function closePay() {
  sheetEl.classList.add("off");
}

/* Which wallet a reader can use is not something this page is allowed to
   guess, and it is not a thing you can read off a user agent. The browser is
   asked and the browser answers for the device it is really running on:
   Safari holding a card in the Wallet says Apple Pay, Chrome signed in to
   Google says Google Pay, a browser with neither says neither. All this does
   is show whichever answer came back, and fall back to the card form when
   none did.

   The answer is also worth keeping. It is recorded against the funnel the
   same way a screen is, so we can finally say what share of the people we
   are paying for could have paid in one tap and what share were always going
   to be handed a form. */
let expressPromise = null;
/* Settled once the browser has said whether it holds a card, so a tap that
   lands before the answer can wait for it instead of assuming the worst. */
const WALLET_WAIT_MS = 2500;
let markWalletAnswered = () => {};
const walletAnswered = new Promise((resolve) => { markWalletAnswered = resolve; });
function mountExpressButton() {
  if (expressPromise) return expressPromise;
  expressPromise = (async () => {
    try {
      await loadOfferings();
      const purchases = await getPurchases();
      const pkg = selectedPackage();
      /* An older SDK on a cached page has no such method. Saying so quietly
         and leaving the card form alone is the right failure here. */
      if (!purchases || !pkg || typeof purchases.presentExpressPurchaseButton !== "function") {
        markWalletAnswered();
        return;
      }
      await setAttribution(purchases);
      /* Resolves when the purchase goes through, which is the only way this
         SDK tells you it did: the listener reports starts, errors and backing
         out, and says nothing at all about a sale. */
      await purchases.presentExpressPurchaseButton({
        rcPackage: pkg,
        htmlTarget: xdockEl,
        walletButtonTheme: "black",
        customerEmail: (currentUser && currentUser.email) || undefined,
        onButtonReady: (updater, walletsAvailable) => {
          ui.express = updater;
          ui.wallets = !!walletsAvailable;
          /* Recorded at the plan screen's own position, read off the live
             flow rather than written down, because one screen before it drops
             out for readers the standing question does not apply to. */
          reportStep(walletsAvailable ? "plan-wallet-yes" : "plan-wallet-no", flow().indexOf(S.PLAN));
          markWalletAnswered();
          if (flow()[state.i] === S.PLAN) render();
        },
        listener: {
          /* The wallet sheet is a modal of the operating system's, so the page
             underneath is locked while it is open the same way it is locked
             while the card form is open. */
          onPurchaseStarted: () => { ui.busy = true; render(); },
        },
      });
      afterPurchase(selectedPackage() || pkg);
    } catch (e) {
      /* A wallet that was closed leaves a button that has already resolved, so
         the slot is emptied and built again rather than left sitting there
         looking live. Backing out of Apple Pay is not an error to report. */
      ui.busy = false;
      expressPromise = null;
      ui.express = null;
      markWalletAnswered();
      xdockEl.innerHTML = "";
      closePay();
      const cancelled = e && (e.errorCode === 1 || /cancel/i.test(String(e.message || "")));
      if (!cancelled) setMsg(t("onboarding.error.generic"));
      /* The plan screen builds it again on its way in, so a re-render is the
         whole of the retry. */
      if (flow()[state.i] === S.PLAN) render();
    }
  })();
  return expressPromise;
}

async function startCheckout() {
  if (ui.busy) return;
  /* No account needed to reach the card. The charge lands on the anonymous
     customer the SDK was started with, and `bindBillingToUser` aliases that
     customer onto the real account as soon as one exists. */
  ui.busy = true;
  setMsg(null);
  render();
  /* The resumed purchase can arrive before the prices have landed, so wait on
     the same load the plan screen is already running rather than racing it. */
  await loadOfferings();
  const pkg = selectedPackage();
  if (!pkg) { ui.busy = false; setMsg(t("onboarding.error.generic")); render(); return; }
  try {
    const purchases = await getPurchases();
    await setAttribution(purchases);
    /* Undefined on the way in means the sheet asks for the address itself,
       which is the usual case now that the card comes before the account. */
    await purchases.purchase({
      rcPackage: pkg,
      customerEmail: (currentUser && currentUser.email) || undefined,
    });
    afterPurchase(pkg);
  } catch (e) {
    ui.busy = false;
    const cancelled = e && (e.errorCode === 1 || /cancel/i.test(String(e.message || "")));
    setMsg(cancelled ? null : t("onboarding.error.generic"));
    render();
  }
}

const manageLink = document.getElementById("manage-link");
manageLink.addEventListener("click", async (ev) => {
  ev.preventDefault();
  const original = manageLink.textContent;
  manageLink.textContent = "...";
  try {
    const purchases = await getPurchases();
    if (!purchases) throw new Error("no session");
    const info = await purchases.getCustomerInfo();
    if (info && info.managementURL) { location.href = info.managementURL; return; }
    throw new Error("no management url");
  } catch (e) {
    manageLink.textContent = original;
    alert(t("onboarding.error.generic"));
  }
});

/* ---------------------------------------------------------------- boot */

/* Older preview links used these names. */
const STEP_ALIASES = {
  worry: S.ABOUT, bread: S.COMPARE, relate: S.FEEL, stat: S.STAKES,
  quiz: S.YEARS, how: S.CRED, anchor: S.STANDING,
  symptoms: SYMPTOM_IDS[0],
};

async function boot() {
  const wanted = new URLSearchParams(location.search).get("step");
  if (wanted) {
    const id = STEP_ALIASES[wanted] || wanted;
    const at = flow().indexOf(id);
    if (at !== -1) { state.i = at; render(); return; }
  }
  let session = null;
  try { session = (await db.auth.getSession()).data.session; } catch (e) {}
  if (session && session.user) {
    currentUser = session.user;
    if (state.purchased) { state.i = flow().indexOf(S.DONE); render(); return; }
    if (state.prefsSaved) { state.i = flow().indexOf(S.PLAN); render(); return; }
    await afterAuth(session.user, false);
    return;
  }
  /* No session, so nothing past the account screen has happened yet. */
  const f = flow();
  if (state.i >= f.indexOf(S.ACCOUNT)) state.i = f.indexOf(S.ACCOUNT);
  render();
}

boot();
</script>
